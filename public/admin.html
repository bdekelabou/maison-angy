<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
  <title>Maison Angy - Espace de Gestion & Caisse</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    /* Login screen styling */
    .login-container {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; z-index: 10000;
    }
    .login-card {
      background: #ffffff; border-radius: 16px; width: 100%; max-width: 420px;
      padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      text-align: center; border-top: 4px solid #c59b27;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .login-logo {
      width: 60px; height: 60px; background: #0f172a; border: 2px solid #c59b27;
      border-radius: 50%; color: #c59b27; font-size: 1.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;
    }
    .toast-msg {
      position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff;
      padding: 12px 20px; border-radius: 8px; border-left: 4px solid #c59b27;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN (Visible if not authenticated) -->
  <div class="login-container" id="loginScreen" style="display: flex;">
    <div class="login-card">
      <img src="/images/logo.jpg" alt="Maison Angy" style="width:75px; height:75px; border-radius:50%; object-fit:cover; border:3px solid #c59b27; margin:0 auto 1.25rem; display:block; box-shadow:0 6px 20px rgba(197,155,39,0.35);" />
      <h2 style="font-size: 1.5rem; color: #0f172a; margin-bottom: 0.35rem;">Maison Angy</h2>
      <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.75rem;">Espace de Gestion & Caisse Privé</p>

      <form onsubmit="handleLogin(event)">
        <div style="text-align: left; margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; color: #334155;">
            Numéro de Téléphone
          </label>
          <input
            type="text"
            id="loginUsername"
            required
            placeholder="Ex: 93849200"
            value="93849200"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
          />
        </div>

        <div style="text-align: left; margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; color: #334155;">
            Mot de Passe
          </label>
          <input
            type="password"
            id="loginPassword"
            required
            placeholder="Entrez votre mot de passe"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
          />
        </div>

        <div id="loginError" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;">
          ⚠️ Identifiant ou mot de passe incorrect.
        </div>

        <button
          type="submit"
          class="btn-action-primary"
          style="width: 100%; padding: 0.8rem; justify-content: center; font-size: 1rem;"
        >
          Se Connecter à l'Espace
        </button>
      </form>

      <div style="margin-top: 1.5rem; font-size: 0.8rem; color: #94a3b8;">
        Accès réservé exclusivement à Ange Ines - Maison Angy
      </div>
    </div>
  </div>

  <!-- 2. MAIN APPLICATION INTERFACE -->
  <div id="appContainer" style="display: none; width: 100vw; height: 100vh; overflow: hidden;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="/images/logo.jpg" alt="Maison Angy" style="width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid #c59b27; margin-right:0.75rem; flex-shrink:0;" />
        <div class="sidebar-title">
          <h2 id="brandStoreName">Maison Angy</h2>
          <span style="color:#c59b27; font-size:0.72rem; font-weight:700;">COLLECTION</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" onclick="switchView('DASHBOARD')" id="nav-DASHBOARD">
          <span>📊</span>
          <span>Tableau de bord</span>
        </button>

        <button class="nav-item" onclick="switchView('ORDERS')" id="nav-ORDERS">
          <span>🛍️</span>
          <span>Commandes & Livraisons</span>
          <span class="nav-badge" id="pendingOrdersBadge" style="display:none;">0</span>
        </button>

        <button class="nav-item" onclick="switchView('DELIVERY_PERSONS')" id="nav-DELIVERY_PERSONS">
          <span>🛵</span>
          <span>Livreurs & Tarifs</span>
        </button>

        <button class="nav-item" onclick="switchView('PRODUCTS')" id="nav-PRODUCTS">
          <span>👗</span>
          <span>Stock & Articles</span>
        </button>

        <button class="nav-item" onclick="switchView('SHIPMENTS')" id="nav-SHIPMENTS">
          <span>📦</span>
          <span>Arrivages & Fournisseurs</span>
        </button>

        <button class="nav-item" onclick="switchView('TRIPS')" id="nav-TRIPS">
          <span>⛽</span>
          <span>Déplacements & Frais</span>
        </button>

        <button class="nav-item" onclick="switchView('CASH')" id="nav-CASH">
          <span>💰</span>
          <span>Caisse & Trésorerie</span>
        </button>

        <button class="nav-item" onclick="switchView('PROFITS')" id="nav-PROFITS">
          <span>📈</span>
          <span>Bénéfices & Rentabilité</span>
        </button>

        <button class="nav-item" onclick="switchView('TEAM')" id="nav-TEAM">
          <span>👥</span>
          <span>Équipe & Gérantes</span>
        </button>

        <button class="nav-item" onclick="switchView('SETTINGS')" id="nav-SETTINGS">
          <span>⚙️</span>
          <span>Configuration & Réseaux</span>
        </button>
      </nav>

      <div class="sidebar-footer" style="flex-direction: column; gap: 0.5rem;">
        <a href="/" target="_blank" class="btn-view-store">
          <span>↗️ Voir Boutique Cliente</span>
        </a>
        <button
          onclick="handleLogout()"
          style="background: transparent; border: 1px solid rgba(239,68,68,0.3); color: #ef4444; width: 100%; padding: 0.45rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;"
        >
          🚪 Déconnexion
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
          <div class="topbar-title" id="pageTitle">Tableau de Bord - Maison Angy</div>
        </div>

        <div class="topbar-right">
          <div id="topUserBadge" style="font-size:0.82rem; color:#475569; background:#f1f5f9; padding:0.38rem 0.75rem; border-radius:9999px; display:inline-flex; align-items:center; gap:0.35rem; white-space:nowrap; border:1px solid #e2e8f0;"></div>
          <div class="cash-pill" title="Trésorerie disponible en caisse">
            <span>🪙 Caisse : <strong id="topbarCash">81 500 FCFA</strong></span>
          </div>

          <div class="topbar-actions">
            <button class="btn-action-primary" style="background:#10b981; color:#fff; font-weight:700;" onclick="openNewSaleModal()">
              <span>🛍️ + Vente (Live / Boutique)</span>
            </button>
            <button class="btn-action-primary" onclick="openProductModal()">
              <span>👗 + Article</span>
            </button>
            <button class="btn-action-primary" style="background:#334155; color:#fff;" onclick="openTripModal('DEPLACEMENT')">
              <span>⛽ + Déplacement / Charge</span>
            </button>
            <button class="btn-action-primary" style="background:#0f172a; color:#fff;" onclick="openDeliveryPersonModal()">
              <span>🛵 + Livreur</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content-area" id="mainContent">
        <!-- Injected by renderView() -->
      </main>
    </div>
  </div>

  <!-- Global Modal Container -->
  <div id="modalContainer"></div>

  <!-- Client Script -->
  <script>
    let appData = {
      settings: { storeName: 'Maison Angy', currency: 'FCFA', currentCash: 81500, fullWhatsapp: '22893849200', whatsappNumber: '93849200' },
      products: [],
      orders: [],
      deliveryPersons: [],
      trips: [],
      cashTransactions: [],
      stats: {}
    };
    let currentView = 'DASHBOARD';
    window.deliverySubTab = window.deliverySubTab || 'ZONES';

    function switchDeliverySubTab(tab) {
      window.deliverySubTab = tab;
      renderView();
    }
    let orderFilter = 'ALL';

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = '✨ ' + msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // --- AUTHENTICATION ---
    function checkAuth() {
      const token = sessionStorage.getItem('angy_auth') || localStorage.getItem('angy_auth');
      if (token) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        applyRolePermissions();
        loadData();
      } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
      }
    }

    function getCurrentUser() {
      return JSON.parse(sessionStorage.getItem('angy_user') || localStorage.getItem('angy_user') || '{"role":"ADMIN","name":"Ange Ines"}');
    }

    function applyRolePermissions() {
      const u = getCurrentUser();
      const isAdmin = u.role === 'ADMIN';
      const perms = u.permissions || (isAdmin 
        ? { products: true, orders: true, delivery: true, trips: true, cash: true, profits: true, settings: true, team: true } 
        : { products: true, orders: true, delivery: true, trips: false, cash: false, profits: false, settings: false, team: false });

      const navProducts = document.getElementById('nav-PRODUCTS');
      const navOrders = document.getElementById('nav-ORDERS');
      const navDelivery = document.getElementById('nav-DELIVERY_PERSONS');
      const navTrips = document.getElementById('nav-TRIPS');
      const navCash = document.getElementById('nav-CASH');
      const navProfits = document.getElementById('nav-PROFITS');
      const navTeam = document.getElementById('nav-TEAM');
      const navShipments = document.getElementById('nav-SHIPMENTS');
      const navSettings = document.getElementById('nav-SETTINGS');
      const topCash = document.querySelector('.cash-pill');

      if (navProducts) navProducts.style.display = (isAdmin || perms.products !== false) ? 'flex' : 'none';
      if (navOrders) navOrders.style.display = (isAdmin || perms.orders !== false) ? 'flex' : 'none';
      if (navDelivery) navDelivery.style.display = (isAdmin || perms.delivery !== false) ? 'flex' : 'none';
      if (navTrips) navTrips.style.display = (isAdmin || perms.trips === true) ? 'flex' : 'none';
      if (navCash) navCash.style.display = (isAdmin || perms.cash === true) ? 'flex' : 'none';
      if (navProfits) navProfits.style.display = (isAdmin || perms.profits === true) ? 'flex' : 'none';
      if (navTeam) navTeam.style.display = isAdmin ? 'flex' : 'none';
      if (navShipments) navShipments.style.display = (isAdmin || perms.products !== false) ? 'flex' : 'none';
      if (navSettings) navSettings.style.display = (isAdmin || perms.settings === true) ? 'flex' : 'none';

      if (topCash) topCash.style.display = (isAdmin || perms.cash === true) ? 'inline-flex' : 'none';

      const userBadge = document.getElementById('topUserBadge');
      if (userBadge) {
        userBadge.innerHTML = isAdmin 
          ? '👑 <strong>' + (u.name || 'Ange Ines') + '</strong> (Propriétaire)'
          : '💼 <strong>' + (u.name || 'Collaboratrice') + '</strong> (' + (u.roleLabel || 'Gérante') + ')';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value.trim();
      const errBox = document.getElementById('loginError');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const d = await res.json();
        if (d.success) {
          sessionStorage.setItem('angy_auth', d.token);
          localStorage.setItem('angy_auth', d.token);
          sessionStorage.setItem('angy_user', JSON.stringify(d.user));
          localStorage.setItem('angy_user', JSON.stringify(d.user));
          errBox.style.display = 'none';
          checkAuth();
        } else {
          errBox.style.display = 'block';
          errBox.textContent = '⚠️ ' + (d.error || 'Identifiant ou mot de passe incorrect.');
        }
      } catch (err) {
        if (u === '93849200' && p === 'password2026') {
          sessionStorage.setItem('angy_auth', 'local_token');
          localStorage.setItem('angy_auth', 'local_token');
          checkAuth();
        } else {
          errBox.style.display = 'block';
        }
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('angy_auth');
      localStorage.removeItem('angy_auth');
      sessionStorage.removeItem('angy_user');
      localStorage.removeItem('angy_user');
      checkAuth();
    }

    async function toggleProductFeatured(id) {
      const p = appData.products.find(item => item.id === id);
      if (!p) return;
      await fetch('/api/products/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isFeatured: !p.isFeatured })
      });
      showToast(p.isFeatured ? 'Retiré de la mise en avant.' : '⭐ Article mis en avant sur la boutique !');
      loadData();
    }

    async function toggleProductPublished(id) {
      const p = appData.products.find(item => item.id === id);
      if (!p) return;
      const willPublish = p.published === false;
      await fetch('/api/products/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ published: willPublish })
      });
      showToast(willPublish ? '👁️ Article publié sur la boutique !' : 'Article masqué de la boutique.');
      loadData();
    }

    
    // 9. TEAM & GERANTES MANAGEMENT VIEW
    function renderTeamView() {
      const users = appData.users || [
        { id: 1, name: "Ange Ines", phone: "93849200", password: "password2026", role: "ADMIN", roleLabel: "Propriétaire & Administratrice" }
      ];

      return `
        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">👥 Gestion de l'Équipe & Accès Collaboratrices</div>
              <p style="color:#64748b; font-size:0.85rem; margin-top:0.25rem;">
                Créez les identifiants pour vos employées et choisissez exactement les fonctionnalités auxquelles elles ont accès (ajouter les articles quand vous n'êtes pas là, voir les commandes, etc. tout en gardant la caisse privée).
              </p>
            </div>
            <button class="btn-action-primary" onclick="openUserModal()">
              <span>+ Créer un Accès Employée</span>
            </button>
          </div>

          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Nom / Collaboratrice</th>
                  <th>Numéro (Identifiant)</th>
                  <th>Mot de passe</th>
                  <th>Poste & Rôle</th>
                  <th>Fonctionnalités Autorisées</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${users.map(u => `
                  <tr>
                    <td>
                      <strong style="color:#0f172a; font-size:0.95rem;">${u.name}</strong>
                      ${u.role === 'ADMIN' ? '<span style="margin-left:0.5rem; background:#fef3c7; color:#92400e; font-size:0.7rem; font-weight:bold; padding:2px 8px; border-radius:9999px;">PROPRIÉTAIRE</span>' : ''}
                    </td>
                    <td>
                      <span style="font-family:monospace; font-weight:600; font-size:0.95rem; color:#1e293b;">
                        📞 ${u.phone}
                      </span>
                    </td>
                    <td>
                      <span style="font-family:monospace; background:#f1f5f9; padding:2px 6px; border-radius:4px; font-size:0.85rem;">
                        ${u.password || '••••••••'}
                      </span>
                    </td>
                    <td>
                      <span style="font-size:0.85rem; font-weight:600; color:${u.role === 'ADMIN' ? '#c59b27' : '#2563eb'};">
                        ${u.roleLabel || (u.role === 'ADMIN' ? 'Propriétaire' : 'Gérante')}
                      </span>
                    </td>
                    <td>
                      <div style="font-size:0.82rem; font-weight:600;">
                        ${u.role === 'ADMIN' ? '<span style="color:#c59b27;">👑 Accès Total (Tous pouvoirs)</span>' : `
                          <div style="display:flex; flex-wrap:wrap; gap:4px;">
                            ${u.permissions?.products !== false ? '<span style="background:#e0f2fe; color:#0369a1; padding:2px 6px; border-radius:4px; font-size:0.75rem;">👗 Articles & Stock</span>' : ''}
                            ${u.permissions?.orders !== false ? '<span style="background:#dcfce7; color:#15803d; padding:2px 6px; border-radius:4px; font-size:0.75rem;">🛍️ Commandes</span>' : ''}
                            ${u.permissions?.delivery !== false ? '<span style="background:#fef3c7; color:#92400e; padding:2px 6px; border-radius:4px; font-size:0.75rem;">🛵 Livreurs</span>' : ''}
                            ${u.permissions?.trips ? '<span style="background:#f1f5f9; color:#475569; padding:2px 6px; border-radius:4px; font-size:0.75rem;">⛽ Déplacements</span>' : ''}
                            ${u.permissions?.cash ? '<span style="background:#d1fae5; color:#065f46; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold;">💰 Caisse</span>' : ''}
                            ${u.permissions?.profits ? '<span style="background:#fef3c7; color:#78350f; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold;">📈 Bénéfices</span>' : ''}
                          </div>
                        `}
                      </div>
                    </td>
                    <td style="text-align:right;">
                      ${u.role !== 'ADMIN' ? `
                        <button class="btn-sm-action" onclick="openUserModal(${u.id})" title="Modifier permissions">✏️ Modifier</button>
                        <button class="btn-sm-action danger" onclick="deleteUser(${u.id})" title="Supprimer">🗑️</button>
                      ` : `
                        <span style="font-size:0.75rem; color:#94a3b8; font-style:italic;">Compte Maître</span>
                      `}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openUserModal(userId) {
      const users = appData.users || [];
      const u = userId ? users.find(item => item.id === userId) : null;
      const perms = u ? (u.permissions || {}) : { products: true, orders: true, delivery: true, trips: false, cash: false, profits: false, settings: false };

      document.getElementById('modalContainer').innerHTML = `
        <div class="admin-modal-overlay active">
          <div class="admin-modal-card" style="max-width:550px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden;">
            <div class="modal-head" style="flex-shrink:0;">
              <h3>${u ? "Modifier l'Accès Employée" : "Créer un Compte Collaboratrice / Gérante"}</h3>
              <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form onsubmit="handleSaveUser(event, ${u ? u.id : 'null'})" style="display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden;">
              <div class="modal-body" style="overflow-y:auto; flex:1 1 auto; min-height:0; padding:1.25rem;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-bottom:0.75rem;">
                  <div>
                    <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Nom de l'employée *</label>
                    <input type="text" id="u_name" required value="${u ? u.name : ''}" placeholder="Ex: Akossiwa Gérante" style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>

                  <div>
                    <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Numéro Téléphone (Connexion) *</label>
                    <input type="text" id="u_phone" required value="${u ? u.phone : ''}" placeholder="Ex: 90123456" style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-bottom:0.75rem;">
                  <div>
                    <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Mot de passe de connexion *</label>
                    <input type="text" id="u_password" required value="${u ? u.password : 'gerante2026'}" style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>

                  <div>
                    <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Titre du poste</label>
                    <input type="text" id="u_roleLabel" value="${u ? (u.roleLabel || 'Gérante Boutique') : 'Gérante Boutique'}" style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>
                </div>

                <div style="margin-bottom:0.75rem;">
                  <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Rôle principal</label>
                  <select id="u_role" ${u && u.role === 'ADMIN' ? 'disabled' : ''} style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
                    <option value="GERANTE" ${!u || u.role === 'GERANTE' ? 'selected' : ''}>💼 Collaboratrice / Gérante (Accès personnalisé ci-dessous)</option>
                    <option value="ADMIN" ${u && u.role === 'ADMIN' ? 'selected' : ''}>👑 Administratrice (Accès Total Caisse & Bénéfices)</option>
                  </select>
                </div>

                <!-- SECTION CASES A COCHER DES FONCTIONNALITES -->
                <div style="background:#f8fafc; padding:1rem; border-radius:8px; border:1px solid #cbd5e1; margin-top:0.75rem;">
                  <label style="font-weight:700; color:#0f172a; margin-bottom:0.25rem; display:block; font-size:0.9rem;">

    async function handleSaveUser(e, id) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('u_name').value.trim(),
        phone: document.getElementById('u_phone').value.trim().replace(/[^0-9]/g, ''),
        password: document.getElementById('u_password').value.trim(),
        role: document.getElementById('u_role').value,
        roleLabel: document.getElementById('u_roleLabel').value.trim(),
        permissions: {
          products: document.getElementById('perm_products').checked,
          orders: document.getElementById('perm_orders').checked,
          delivery: document.getElementById('perm_delivery').checked,
          trips: document.getElementById('perm_trips').checked,
          cash: document.getElementById('perm_cash').checked,
          profits: document.getElementById('perm_profits').checked,
          settings: false
        }
      };

      const url = id ? '/api/users/' + id : '/api/users';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      closeModal();
      showToast('Compte employée et permissions enregistrés !');
      loadData();
    }

    async function deleteUser(id) {
      if (confirm('Voulez-vous vraiment supprimer cet accès gérante ?')) {
        await fetch('/api/users/' + id, { method: 'DELETE' });
        showToast('Accès gérante supprimé.');
        loadData();
      }
    }

    // --- DATA ---
    async function loadData() {
      try {
        const res = await fetch('/api/all');
        appData = await res.json();
        updateTopBar();
        renderView();
      } catch (e) {
        console.error('Erreur API:', e);

    function updateTopBar() {
      const cash = appData.settings?.currentCash !== undefined ? appData.settings.currentCash : 81500;
      const curr = appData.settings?.currency || 'FCFA';
      document.getElementById('topbarCash').textContent = cash.toLocaleString('fr-FR') + ' ' + curr;
      document.getElementById('brandStoreName').textContent = appData.settings?.storeName || 'Maison Angy';

      const pending = (appData.orders || []).filter(o => o.status !== 'LIVRE' && o.status !== 'ANNULE').length;
      const unpaidDebts = (appData.orders || []).filter(o => o.status !== 'ANNULE' && ((o.remainingAmount !== undefined ? o.remainingAmount : (o.paymentStatus !== 'PAYE' ? o.totalOrder : 0)) > 0));
      const debtBadge = document.getElementById('debtsBadge');
      if (debtBadge) {
        if (unpaidDebts.length > 0) {
          debtBadge.style.display = 'inline-block';
          debtBadge.textContent = unpaidDebts.length;
        } else {
          debtBadge.style.display = 'none';
        }
      }
      const badge = document.getElementById('pendingOrdersBadge');
      if (pending > 0) {
        badge.style.display = 'inline-block';
        badge.textContent = pending;
      } else {
        badge.style.display = 'none';
      }
    }

    // 5. TRIPS & EXPENSES VIEW (Déplacements Marchandises + Salaires + Charges)
    async function deleteTrip(id) {
      if (!confirm('Supprimer cette dépense / ce déplacement ? (Le montant sera automatiquement recrédité dans la caisse)')) return;
      try {
        const res = await fetch('/api/trips/' + id, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          showToast('✅ Dépense supprimée et caisse mise à jour.');
          await loadData();
          if (currentView === 'PROFITS') switchView('PROFITS');
          else switchView('TRIPS');
        } else {
          alert('Erreur: ' + (json.error || 'Impossible de supprimer'));
        }
      } catch (err) {
        alert('Erreur réseau: ' + err.message);
      }
    }

                  <th>Date</th>
                  <th>Catégorie</th>
                  <th>Motif / Détails</th>
                  <th>Mode / Moyen</th>
                  <th>Montant Déduit</th>
                  <th style="text-align:right;">Action</th>
                </tr>
              </thead>
              <tbody>
                ${trips.length === 0 ? '<tr><td colspan="6" style="text-align:center; padding:3rem;">Aucun déplacement ni charge enregistré pour le moment.</td></tr>' : trips.slice().reverse().map(t => {
                  const cat = t.category || 'DEPLACEMENT';
                  const catBadge = cat === 'SALAIRE'
                    ? '<span class="badge-status" style="background:#ede9fe; color:#6d28d9; font-weight:700;">👩‍💼 SALAIRE</span>'
                    : cat === 'CHARGE'
                    ? '<span class="badge-status" style="background:#fee2e2; color:#b91c1c; font-weight:700;">📦 CHARGE BOUTIQUE</span>'
                    : '<span class="badge-status status-a-recuperer">🛵 DÉPLACEMENT MARCHANDISE</span>';
                  return `
                  <tr>
                    <td style="white-space:nowrap; font-size:0.82rem; color:#475569; font-weight:600;">${t.dateTime || t.date || '-'}</td>
                    <td>${catBadge}</td>
                    <td><strong>${t.description}</strong></td>
                    <td><span style="font-size:0.8rem; color:#475569;">${t.transportType || '-'}</span></td>
                    <td><strong style="color:#b91c1c;">-${(t.cost || 0).toLocaleString('fr-FR')} ${curr}</strong></td>
                    <td style="text-align:right;">
                      <button class="btn-sm-action danger" onclick="deleteTrip(${t.id})" title="Supprimer cette dépense">🗑️</button>
                    </td>
                  </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // 6. CASH VIEW
    async function deleteCash(id) {
      if (!confirm('Supprimer cette transaction de caisse ? Seule la plus récente peut être supprimée.')) return;
      try {
        const res = await fetch('/api/cash/' + id, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          showToast('✅ Transaction supprimée.');
          await loadData();
          switchView('CASH');
        } else {
          alert('Erreur: ' + json.error);
        }
      } catch (err) {
        alert('Erreur réseau: ' + err.message);
      }
    }
    
    function renderCash() {
      const curr = appData.settings.currency || 'FCFA';
      const cash = appData.settings?.currentCash !== undefined ? appData.settings.currentCash : 81500;
      const txs = appData.cashTransactions || [];

      return `
        <div style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color:#fff; border-radius:12px; padding:1.75rem; margin-bottom:1.5rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; border-bottom:3px solid #c59b27;">
          <div>
            <span style="font-size:0.8rem; color:#c59b27; text-transform:uppercase; letter-spacing:0.1em; font-weight:600;">Solde de Caisse en Direct</span>
            <h2 style="font-size:2.2rem; margin-top:0.25rem;">${cash.toLocaleString('fr-FR')} ${curr}</h2>
            <p style="color:#94a3b8; font-size:0.85rem;">Solde réel disponible en caisse (espèces & Mobile Money)</p>
          </div>
          <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
            <button class="btn-action-primary" style="background:#10b981; color:#fff;" onclick="openCashModal('DEPOT')">+ Dépôt / Entrée Espèces</button>
            <button class="btn-action-primary" style="background:#ef4444; color:#fff;" onclick="openCashModal('RETRAIT')">+ Retrait / Dépense</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">🧾 Journal des Opérations de Caisse</div>
          </div>
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date/Heure</th>
                  <th>Commentaire</th>
                  <th>Entrée (Encaissement / Dépôt)</th>
                  <th>Sortie (Retrait)</th>
                  <th style="text-align:right;">Action</th>
                </tr>
              </thead>
              <tbody>
                ${txs.slice().reverse().map((t, idx) => `
                  <tr>
                    <td style="font-size:0.8rem; color:#64748b;">${t.dateTime}</td>
                    <td><strong>${t.commentaires || 'Opération'}</strong></td>
                    <td>
                      ${t.encaissement > 0 ? `<span style="color:#10b981; font-weight:700;">+${t.encaissement.toLocaleString('fr-FR')} F (Vente)</span>` : ''}
                      ${t.depot > 0 ? `<span style="color:#3b82f6; font-weight:700;">+${t.depot.toLocaleString('fr-FR')} F (Dépôt)</span>` : ''}
                      ${t.encaissement === 0 && t.depot === 0 ? '-' : ''}
                    </td>
                    <td>${t.retrait > 0 ? `<span style="color:#ef4444; font-weight:700;">-${t.retrait.toLocaleString('fr-FR')} F</span>` : '-'}</td>
                    <td style="text-align:right;">
                      ${idx === 0 ? `<button class="btn-sm-action primary" onclick="deleteCash(${t.id})" style="background:#ef4444; color:#fff; border:none; padding:6px; border-radius:4px; cursor:pointer;" title="Supprimer">🗑️</button>` : ''}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // 7. PROFITS VIEW (Bénéfice Brut - Déplacements Marchandises - Salaires & Charges = Bénéfice Net Réel par Mois)
    window.selectedProfitMonth = window.selectedProfitMonth || 'ALL';

    function formatMonthLabel(ym) {
      if (!ym || ym === 'ALL') return 'Tous les mois (Cumul Global)';
      const names = {
        '01': 'Janvier', '02': 'Février', '03': 'Mars', '04': 'Avril',
        '05': 'Mai', '06': 'Juin', '07': 'Juillet', '08': 'Août',
        '09': 'Septembre', '10': 'Octobre', '11': 'Novembre', '12': 'Décembre'
      };
      const parts = ym.split('-');
      if (parts.length === 2) return `${names[parts[1]] || parts[1]} ${parts[0]}`;
      return ym;
    }

    function extractYearMonth(dateStr) {
      if (!dateStr) return '2026-10';
      const s = String(dateStr).trim();
      // Format YYYY-MM-DD
      if (/^\d{4}-\d{2}/.test(s)) return s.slice(0, 7);
      // Format DD/MM/YYYY
      const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      if (m) return `${m[3]}-${m[2]}`;
      return '2026-10';
    }

    function changeProfitMonth(ym) {
      window.selectedProfitMonth = ym;
      renderView();
    }

    function renderProfits() {
      const curr = appData.settings.currency || 'FCFA';
      const deliveredOrders = (appData.orders || []).filter(o => o.status === 'LIVRE');
      const allTrips = appData.trips || [];
      const allCash = appData.cashTransactions || [];

      // Collect all available months
      const monthSet = new Set(['2026-10', new Date().toISOString().slice(0, 7)]);
      deliveredOrders.forEach(o => monthSet.add(extractYearMonth(o.date || o.createdAt)));
      allTrips.forEach(t => monthSet.add(extractYearMonth(t.date || t.dateTime)));
      allCash.forEach(c => {
        if (c.category === 'SALAIRE' || c.category === 'CHARGE' || /salaire|paie|gérante|assistante/i.test(c.commentaires || '')) {
          monthSet.add(extractYearMonth(c.date || c.dateTime));
        }
      });
      const availableMonths = Array.from(monthSet).sort().reverse();

      // Helper to compute stats for a given month ('ALL' or 'YYYY-MM')
      function computeMonthBreakdown(ym) {
        const ords = ym === 'ALL' ? deliveredOrders : deliveredOrders.filter(o => extractYearMonth(o.date || o.createdAt) === ym);
        const trps = ym === 'ALL' ? allTrips : allTrips.filter(t => extractYearMonth(t.date || t.dateTime) === ym);
        const csh = ym === 'ALL' ? allCash : allCash.filter(c => extractYearMonth(c.date || c.dateTime) === ym);

        const sales = ords.reduce((sum, o) => sum + (o.totalItems || 0), 0);
        const costOfGoods = ords.reduce((sum, o) => sum + ((o.totalItems || 0) - (o.marginNet || o.marginGross || 0)), 0);
        const grossGain = ords.reduce((sum, o) => sum + (o.marginNet || o.marginGross || 0), 0);

        const tripsDeplacement = trps.filter(t => (t.category || 'DEPLACEMENT') === 'DEPLACEMENT').reduce((sum, t) => sum + (t.cost || 0), 0);
        const tripsSalaire = trps.filter(t => t.category === 'SALAIRE').reduce((sum, t) => sum + (t.cost || 0), 0);
        const tripsCharge = trps.filter(t => t.category === 'CHARGE').reduce((sum, t) => sum + (t.cost || 0), 0);

        const cashSalaire = csh.filter(c => !c.tripId && (c.category === 'SALAIRE' || /salaire|paie|gérante|assistante/i.test(c.commentaires || ''))).reduce((sum, c) => sum + (c.retrait || 0), 0);
        const cashCharge = csh.filter(c => !c.tripId && c.category === 'CHARGE').reduce((sum, c) => sum + (c.retrait || 0), 0);

        const totalDeplacements = tripsDeplacement;
        const totalSalaires = tripsSalaire + cashSalaire;
        const totalCharges = tripsCharge + cashCharge;
        const netReal = grossGain - totalDeplacements - totalSalaires - totalCharges;

        return {
          orders: ords,
          trips: trps,
          sales,
          costOfGoods,
          grossGain,
          totalDeplacements,
          totalSalaires,
          totalCharges,
          netReal
        };
      }

      const selMonth = window.selectedProfitMonth || 'ALL';
      const cur = computeMonthBreakdown(selMonth);

      return `
        <!-- BARRE DE SELECTION DU MOIS ET ACTIONS RAPIDES -->
        <div class="panel" style="margin-bottom:1.25rem; padding:1rem 1.25rem; background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color:#fff; border-bottom:3px solid #c59b27;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <div>
              <span style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em; color:#c59b27; font-weight:700;">📊 Calcul Comptable Réel — Maison Angy</span>
              <h3 style="font-size:1.25rem; margin-top:0.2rem; color:#fff;">Bilan : ${formatMonthLabel(selMonth)}</h3>
              <p style="font-size:0.82rem; color:#cbd5e1; margin-top:2px;">Formule appliquée : <strong>Gain Brut Ventes</strong> − <strong>Déplacements Marchandises</strong> − <strong>Salaires & Charges</strong> = <strong>Bénéfice Net Réel</strong></p>
            </div>
            <div style="display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap;">
              <select onchange="changeProfitMonth(this.value)" style="padding:0.55rem 0.9rem; border-radius:8px; border:1.5px solid #c59b27; background:#0f172a; color:#fef3c7; font-weight:700; font-size:0.85rem; cursor:pointer;">
                <option value="ALL" ${selMonth === 'ALL' ? 'selected' : ''}>📅 Tous les mois (Cumul)</option>
                ${availableMonths.map(ym => `<option value="${ym}" ${selMonth === ym ? 'selected' : ''}>🗓️ ${formatMonthLabel(ym)}</option>`).join('')}
              </select>
              <button class="btn-action-primary" onclick="openTripModal('DEPLACEMENT')" style="background:#ea580c; color:#fff;">
                🛵 + Déplacement Marchandise
              </button>
              <button class="btn-action-primary" onclick="openTripModal('SALAIRE')" style="background:#7c3aed; color:#fff;">
                👩‍💼 + Salaire / Charge
              </button>
            </div>
          </div>
        </div>

        <!-- LES 4 CARTES DU CALCUL DU BENEFICE NET REEL -->
        <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom:1.5rem;">
          <div class="kpi-card green">
            <div class="kpi-icon green">1️⃣</div>
            <div class="kpi-info">
              <h4>Gain Brut sur Ventes</h4>
              <div class="kpi-value" style="color:#059669;">+${cur.grossGain.toLocaleString('fr-FR')} ${curr}</div>
              <div class="kpi-sub">Ventes (${cur.sales.toLocaleString('fr-FR')} F) − Achat (${cur.costOfGoods.toLocaleString('fr-FR')} F)</div>
            </div>
          </div>

          <div class="kpi-card orange">
            <div class="kpi-icon orange">2️⃣</div>
            <div class="kpi-info">
              <h4>− Déplacements Marchandises</h4>
              <div class="kpi-value" style="color:#ea580c;">-${cur.totalDeplacements.toLocaleString('fr-FR')} ${curr}</div>
              <div class="kpi-sub">Courses marché, grossistes, colis</div>
            </div>
          </div>

          <div class="kpi-card purple">
            <div class="kpi-icon purple">3️⃣</div>
            <div class="kpi-info">
              <h4>− Salaires & Charges</h4>
              <div class="kpi-value" style="color:#7c3aed;">-${(cur.totalSalaires + cur.totalCharges).toLocaleString('fr-FR')} ${curr}</div>
              <div class="kpi-sub">Salaires (${cur.totalSalaires.toLocaleString('fr-FR')} F) + Charges (${cur.totalCharges.toLocaleString('fr-FR')} F)</div>
            </div>
          </div>

          <div class="kpi-card gold" style="border:2px solid ${cur.netReal >= 0 ? '#10b981' : '#ef4444'}; background:${cur.netReal >= 0 ? '#f0fdf4' : '#fef2f2'};">
            <div class="kpi-icon gold">✅</div>
            <div class="kpi-info">
              <h4 style="color:#0f172a; font-weight:800;">= BÉNÉFICE NET RÉEL (Ce qu'il reste)</h4>
              <div class="kpi-value" style="color:${cur.netReal >= 0 ? '#15803d' : '#b91c1c'}; font-size:1.55rem;">
                ${cur.netReal >= 0 ? '+' : ''}${cur.netReal.toLocaleString('fr-FR')} ${curr}
              </div>
              <div class="kpi-sub" style="font-weight:700; color:#334155;">
                ${selMonth === 'ALL' ? 'Reste net en poche sur toutes les périodes' : 'Ce qu\'il reste vraiment en ' + formatMonthLabel(selMonth)}
              </div>
            </div>
          </div>
        </div>

        <!-- TABLEAU RECAPITULATIF MOIS PAR MOIS (Ex: En Octobre il reste tel montant) -->
        <div class="panel" style="margin-bottom:1.5rem;">
          <div class="panel-header">
            <div>
              <div class="panel-title">🗓️ Bilan Mois par Mois : Ce qu'il vous reste réellement</div>
              <p style="color:#64748b; font-size:0.82rem; margin-top:2px;">Cliquez sur un mois pour voir le détail des ventes et des déplacements de ce mois.</p>
            </div>
          </div>
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Mois</th>
                  <th>Chiffre d'Affaires</th>
                  <th>Gain Brut (Marge Ventes)</th>
                  <th>− Déplacements Marchandises</th>
                  <th>− Salaires & Charges</th>
                  <th>= Bénéfice Net Réel (Reste)</th>
                  <th style="text-align:right;">Détail</th>
                </tr>
              </thead>
              <tbody>
                ${availableMonths.map(ym => {
                  const m = computeMonthBreakdown(ym);
                  const isSelected = selMonth === ym;
                  return `
                    <tr style="${isSelected ? 'background:#fefce8;' : ''}">
                      <td><strong>🗓️ ${formatMonthLabel(ym)}</strong></td>
                      <td>${m.sales.toLocaleString('fr-FR')} ${curr} <span style="font-size:0.75rem; color:#64748b;">(${m.orders.length} cmd)</span></td>
                      <td><strong style="color:#059669;">+${m.grossGain.toLocaleString('fr-FR')} ${curr}</strong></td>
                      <td><strong style="color:#ea580c;">-${m.totalDeplacements.toLocaleString('fr-FR')} ${curr}</strong></td>
                      <td><strong style="color:#7c3aed;">-${(m.totalSalaires + m.totalCharges).toLocaleString('fr-FR')} ${curr}</strong></td>
                      <td>
                        <span style="padding:0.3rem 0.7rem; border-radius:8px; font-weight:800; font-size:0.9rem; background:${m.netReal >= 0 ? '#dcfce7' : '#fee2e2'}; color:${m.netReal >= 0 ? '#15803d' : '#b91c1c'};">
                          ${m.netReal >= 0 ? '+' : ''}${m.netReal.toLocaleString('fr-FR')} ${curr}
                        </span>
                      </td>
                      <td style="text-align:right;">
                        <button class="btn-sm-action" onclick="changeProfitMonth('${ym}')">🔎 Voir ce mois</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- DETAIL DES VENTES ET DES CHARGES DU MOIS SELECTIONNE -->
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap:1.25rem;">
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">🛍️ Gains Bruts par Vente Livrée (${cur.orders.length})</div>
            </div>
            <div class="data-table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date / Cmd</th>
                    <th>Articles</th>
                    <th>Prix Vente</th>
                    <th>Coût Achat</th>
                    <th>Gain Brut</th>
                  </tr>
                </thead>
                <tbody>
                  ${cur.orders.length === 0 ? `
                    <tr><td colspan="5" style="text-align:center; padding:2.5rem; color:#64748b;">Aucune vente livrée sur cette période.</td></tr>
                  ` : cur.orders.map(o => `
                    <tr>
                      <td>
                        <strong>${o.id}</strong><br/>
                        <small style="color:#64748b;">${o.date || ''} • ${o.customerName}</small>
                      </td>
                      <td style="font-size:0.82rem;">${(o.items || []).map(i => `${i.productName} (x${i.quantity || 1})`).join(', ')}</td>
                      <td>${(o.totalItems || 0).toLocaleString('fr-FR')} F</td>
                      <td>${((o.totalItems || 0) - (o.marginNet || o.marginGross || 0)).toLocaleString('fr-FR')} F</td>
                      <td><strong style="color:#059669;">+${(o.marginNet || o.marginGross || 0).toLocaleString('fr-FR')} F</strong></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">⛽ Déplacements & Salaires Déduits (${cur.trips.length})</div>
              <button class="btn-sm-action" onclick="openTripModal('DEPLACEMENT')">+ Ajouter</button>
            </div>
            <div class="data-table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Motif</th>
                    <th>Montant</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  ${cur.trips.length === 0 ? `
                    <tr><td colspan="5" style="text-align:center; padding:2.5rem; color:#64748b;">Aucun déplacement ni salaire déduit sur cette période.</td></tr>
                  ` : cur.trips.slice().reverse().map(t => {
                    const cat = t.category || 'DEPLACEMENT';
                    return `
                    <tr>
                      <td style="font-size:0.78rem; color:#64748b; white-space:nowrap;">${t.date || t.dateTime || '-'}</td>
                      <td><span style="font-size:0.72rem; font-weight:700; padding:2px 6px; border-radius:4px; background:${cat === 'SALAIRE' ? '#ede9fe' : cat === 'CHARGE' ? '#fee2e2' : '#ffedd5'}; color:${cat === 'SALAIRE' ? '#6d28d9' : cat === 'CHARGE' ? '#b91c1c' : '#c2410c'};">${cat}</span></td>
                      <td><strong>${t.description}</strong></td>
                      <td><strong style="color:#b91c1c;">-${(t.cost || 0).toLocaleString('fr-FR')} F</strong></td>
                      <td style="text-align:right;">
                        <button class="btn-sm-action danger" onclick="deleteTrip(${t.id})" title="Supprimer">🗑️</button>
                      </td>
                    </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // 8. SETTINGS VIEW

      return `
        <div style="max-width:700px; margin:0 auto;">
          <div class="panel">
            <div class="panel-header">

            </div>

    async function handleLogoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      showToast('⏳ Envoi du logo...');
      try {
        const compressed = await compressImage(file, 800, 0.9);
        const url = await uploadImageToServer(compressed, file.name);
        const input = document.getElementById('cfg_logoUrl');
        const prev = document.getElementById('cfg_logo_preview');
        if (input) input.value = url;
        if (prev) prev.src = url;
        showToast('✅ Logo sélectionné ! Cliquez sur Enregistrer pour valider.');
      } catch (err) {
        alert('Erreur upload logo: ' + err.message);
      } finally {
        event.target.value = '';
      }
    }

    async function handleSaveDeliveryZone(e, id) {

      const payload = {

        price: parseFloat(document.getElementById('zone_price').value) || 0,

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const d = await res.json();
        if (d.success) {
          closeModal();
          showToast('Quartier et tarif enregistrés avec succès !');
          loadData();
        } else {
          alert('Erreur: ' + (d.error || 'Erreur lors de l\'enregistrement'));

        alert('Erreur réseau: ' + err.message);
      }

      const newPrice = parseFloat(input.value);
      if (isNaN(newPrice) || newPrice < 0) {
        alert('Veuillez entrer un montant valide');
        return;
      }

      try {
        const res = await fetch(`/api/delivery-zones/${zoneId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ price: newPrice })
        });
        const d = await res.json();
        if (d.success) {
          showToast(`Tarif mis à jour à ${newPrice.toLocaleString('fr-FR')} FCFA !`);
          loadData();
        }
      } catch (err) {
        alert('Erreur réseau: ' + err.message);
      }
    }

    // IMAGE COMPRESSION & DIRECT UPLOAD UTILITIES
    function compressImage(file, maxWidth = 1200, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth || h > maxWidth) {
              if (w > h) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              } else {
                w = Math.round((w * maxWidth) / h);
                h = maxWidth;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadImageToServer(dataUrl, originalName) {
      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: dataUrl, name: originalName })
        });
        if (res.ok) {
          const json = await res.json();
          if (json && json.success && json.url) return json.url;
        }
      } catch (err) {
        console.warn('Upload API unreachable, using local dataUrl:', err);
      }
      return dataUrl;
    }

    async function handleBulkImageUpload(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const progress = document.getElementById('uploadProgressIndicator');
      if (progress) {
        progress.style.display = 'inline-block';
        progress.textContent = '⏳ Optimisation et envoi de vos photos...';
      }

      try {
        const uploadedUrls = [];
        for (let i = 0; i < files.length && uploadedUrls.length < 5; i++) {
          if (progress) {
            progress.textContent = `⏳ Photo ${i + 1} sur ${Math.min(files.length, 5)} en cours d'envoi...`;
          }
          const compressed = await compressImage(files[i]);
          const url = await uploadImageToServer(compressed, files[i].name);
          uploadedUrls.push(url);
        }

        // Check if currently holding dummy unsplash photos
        const isDefault = window.productModalImages.every(img => img.includes('unsplash.com'));
        if (isDefault) {
          window.productModalImages = uploadedUrls;
        } else {
          window.productModalImages = [...window.productModalImages, ...uploadedUrls].slice(0, 5);
        }

        while (window.productModalImages.length < 2) {
          window.productModalImages.push(window.productModalImages[0] || '/images/logo.jpg');
        }

        window.productModalCoverIndex = 0;
        renderAdminImageSlots();
        showToast(`✅ ${uploadedUrls.length} photo(s) ajoutée(s) directement avec succès !`);
      } catch (err) {
        alert('Erreur lors de l\'envoi: ' + err.message);
      } finally {
        if (progress) progress.style.display = 'none';
        event.target.value = '';
      }
    }

    async function handleSingleSlotUpload(idx, event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      showToast('⏳ Envoi de la photo...');
      try {
        const compressed = await compressImage(file);
        const url = await uploadImageToServer(compressed, file.name);
        window.productModalImages[idx] = url;
        renderAdminImageSlots();
        showToast(`✅ Photo #${idx + 1} mise à jour avec succès !`);
      } catch (err) {
        alert('Erreur: ' + err.message);
      } finally {
        event.target.value = '';
      }
    }

        alert('Veuillez renseigner au moins 2 photos pour cet article (2 à 5 photos requises).');

      let covIdx = window.productModalCoverIndex;
      if (covIdx < 0 || covIdx >= cleanImages.length) {
        covIdx = 0;

      const coverImage = cleanImages[covIdx] || cleanImages[0];

      const payload = {
        name: document.getElementById('p_name').value,
        category: document.getElementById('p_category').value,

        image: coverImage,
        images: cleanImages,
        coverIndex: covIdx

    async function confirmAssign(orderId) {
      const name = document.getElementById('assign_dp_name').value;
      const fee = parseFloat(document.getElementById('assign_fee').value) || 0;
      const payer = document.getElementById('assign_payer').value;

      await fetch(`/api/orders/${orderId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          deliveryPersonName: name,
          deliveryFee: fee,
          deliveryFeePayer: payer,
          status: 'EN_LIVRAISON'
        })
      });
      closeModal();
      showToast('Livreur assigné !');
      loadData();
    }

    async function markDelivered(orderId) {
      if (confirm('Confirmer que la commande a été livrée et que l\'argent est rentré en caisse ?')) {
        await fetch(`/api/orders/${orderId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'LIVRE' })
        });
        showToast('Commande livrée et ajoutée à la caisse !');
        loadData();
      }
    }

    function getStatusBadge(st) {
      if (st === 'A_PREPARER') return '<span class="badge-status status-a-preparer">🟡 À préparer</span>';
      if (st === 'EN_LIVRAISON') return '<span class="badge-status status-en-livraison">🟠 En livraison</span>';
      if (st === 'A_RECUPERER') return '<span class="badge-status status-a-recuperer">🔵 À récupérer</span>';
      if (st === 'EXPEDITION') return '<span class="badge-status status-expedition">🟣 Expédié</span>';
      if (st === 'LIVRE') return '<span class="badge-status status-livre">🟢 Livré</span>';
      return st;
    }

      if (mode === 'LIVRAISON_DOMICILE') return '<span class="badge-status status-en-livraison">🛵 Domicile</span>';
      if (mode === 'RETRAIT_BOUTIQUE') return '<span class="badge-status status-a-recuperer">🏪 Boutique</span>';
      if (mode === 'EXPEDITION') return '<span class="badge-status status-expedition">📦 Gare</span>';

    async function deleteShipment(id) {
      if (!confirm('Supprimer cet arrivage et déduire ses quantités du stock ?')) return;
      try {
        const res = await fetch('/api/shipments/' + id, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          showToast('✅ Arrivage supprimé.');
          await loadData();
          switchView('SHIPMENTS');
        } else {
          alert('Erreur: ' + json.error);
        }
      } catch (err) {
        alert('Erreur réseau: ' + err.message);
      }
    }

    function editShipment(id) {
      const s = (appData.shipments || []).find(it => it.id === id);
      if (!s) return;
      window.editingShipmentId = id;
      window.currentShipmentRows = s.items.map(it => ({...it}));
      openNewShipmentModal(null);
      // after it opens, fill values
      setTimeout(() => {
        document.getElementById('ship_number').value = s.number || '';
        document.getElementById('ship_supplier').value = s.supplier || '';
        document.getElementById('ship_date').value = s.date || '';
        document.getElementById('ship_notes').value = s.notes || '';
        const btn = document.querySelector('button[onclick="handleSaveShipment(event)"]');
        if(!btn) {

           if(submitBtn) submitBtn.innerHTML = '💾 Enregistrer les Modifications';
        }
      }, 50);

    function renderShipmentRows() {
      const container = document.getElementById('shipmentRowsContainer');
      if (!container) return;
      const products = appData.products || [];
      const curr = appData.settings.currency || 'FCFA';

      let totalQty = 0;
      let totalCost = 0;

      container.innerHTML = window.currentShipmentRows.map((row, idx) => {
        const prod = products.find(p => p.id === row.productId) || products[0];
        const lineTotal = (row.quantity || 0) * (row.costPrice || 0);
        totalQty += (row.quantity || 0);
        totalCost += lineTotal;

        return `
          <div style="display:grid; grid-template-columns:2.5fr 1fr 1.2fr 1.2fr auto; gap:0.5rem; align-items:center; background:#fff; padding:0.55rem 0.75rem; border:1px solid #cbd5e1; border-radius:6px;">

                ${products.map(p => `
                  <option value="${p.id}" ${p.id === row.productId ? 'selected' : ''}>
                    ${p.name} (Stock actuel: ${p.stock} pcs)
                  </option>
                `).join('')}
              </select>
            </div>

            <div>
              <label style="display:block; font-size:0.7rem; color:#64748b; font-weight:600;">Quantité reçue</label>
              <input type="number" min="1" value="${row.quantity}" oninput="updateShipmentRowField(${idx}, 'quantity', this.value)" style="width:100%; padding:0.45rem; border:1px solid #cbd5e1; border-radius:4px; font-size:0.85rem; font-weight:700; color:#2563eb;" />
            </div>

            <div>
              <label style="display:block; font-size:0.7rem; color:#64748b; font-weight:600;">Prix d'Achat payé (${curr})</label>
              <input type="number" min="0" value="${row.costPrice}" oninput="updateShipmentRowField(${idx}, 'costPrice', this.value)" style="width:100%; padding:0.45rem; border:1px solid #cbd5e1; border-radius:4px; font-size:0.85rem; font-weight:600;" />
            </div>

            <div>
              <label style="display:block; font-size:0.7rem; color:#64748b; font-weight:600;">Prix Vente habituel (${curr})</label>
              <input type="number" min="0" value="${row.salePrice}" oninput="updateShipmentRowField(${idx}, 'salePrice', this.value)" style="width:100%; padding:0.45rem; border:1px solid #cbd5e1; border-radius:4px; font-size:0.85rem; font-weight:600; color:#0f172a;" />
            </div>

            <div style="text-align:right; padding-top:1rem;">
              ${window.currentShipmentRows.length > 1 ? `
                <button type="button" onclick="removeShipmentRow(${idx})" style="background:#fee2e2; color:#b91c1c; border:none; border-radius:4px; width:28px; height:28px; cursor:pointer;" title="Retirer cette ligne">
                  ✕
                </button>
              ` : `
                <div style="width:28px; height:28px;"></div>
              `}
            </div>
          </div>
        `;
      }).join('');

      const qtyPreview = document.getElementById('shipTotalQtyPreview');

      const pId = parseInt(prodId);

      if (prod) {

    function updateShipmentRowField(idx, field, val) {
      window.currentShipmentRows[idx][field] = parseFloat(val) || 0;
      const curr = appData.settings.currency || 'FCFA';
      let totalQty = 0;
      let totalCost = 0;
      window.currentShipmentRows.forEach(r => {
        totalQty += (r.quantity || 0);
        totalCost += ((r.quantity || 0) * (r.costPrice || 0));
      });
      const qtyPreview = document.getElementById('shipTotalQtyPreview');
      const costPreview = document.getElementById('shipTotalCostPreview');
      if (qtyPreview) qtyPreview.textContent = `+${totalQty} pièces`;
      if (costPreview) costPreview.textContent = `${totalCost.toLocaleString('fr-FR')} ${curr}`;

    async function handleSaveShipment(e) {
      e.preventDefault();
      const payload = {
        number: document.getElementById('ship_number').value.trim(),
        supplier: document.getElementById('ship_supplier').value.trim(),
        date: document.getElementById('ship_date').value,
        notes: document.getElementById('ship_notes').value.trim(),
        registeredBy: (typeof currentUser !== 'undefined' && currentUser) ? currentUser.name : 'Ange Ines',
        items: window.currentShipmentRows
      };

      try {
        const res = await fetch('/api/shipments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.success) {
          closeModal();
          showToast(`✅ Arrivage ${payload.number} enregistré ! Les stocks ont été augmentés.`);
          await loadData();
          if (currentView === 'SHIPMENTS') switchView('SHIPMENTS');
          else if (currentView === 'PRODUCTS') switchView('PRODUCTS');
        } else {
          alert('Erreur: ' + (json.error || 'Impossible d\'enregistrer l\'arrivage.'));
        }
      } catch (err) {
        alert('Erreur réseau lors de l\'enregistrement de l\'arrivage: ' + err.message);
      }
    }

    function toggleSaleDeliveryFee() {
      const mode = document.getElementById('sale_delivery_mode')?.value;
      const feeRow = document.getElementById('saleDeliveryFeeRow');
      if (feeRow) feeRow.style.display = mode === 'LIVRAISON_DOMICILE' ? 'block' : 'none';
      calculateSaleTotals();
    }

    function calculateSaleTotals(setDefaultPaid = false) {
      const curr = appData.settings.currency || 'FCFA';
      let totalItems = 0;
      let totalQty = 0;

      (window.currentSaleRows || []).forEach(r => {
        const qty = r.quantity || 1;
        const price = r.unitPrice || 0;
        totalQty += qty;
        totalItems += (qty * price);
      });

      const mode = document.getElementById('sale_delivery_mode')?.value;
      const feeInput = document.getElementById('sale_delivery_fee');
      const deliveryFee = (mode === 'LIVRAISON_DOMICILE' && feeInput) ? (parseFloat(feeInput.value) || 0) : 0;
      const totalOrder = totalItems + deliveryFee;

      const totalPreview = document.getElementById('saleTotalOrderPreview');
      const qtyPreview = document.getElementById('saleTotalQtyPreview');
      if (totalPreview) totalPreview.textContent = `${totalOrder.toLocaleString('fr-FR')} ${curr}`;
      if (qtyPreview) qtyPreview.textContent = `${totalQty} pcs`;

      const paidInput = document.getElementById('sale_amount_paid');
      if (paidInput) {
        if (setDefaultPaid && (!paidInput.value || paidInput.dataset.modified !== 'true')) {
          paidInput.value = totalOrder;
        }
        const paid = parseFloat(paidInput.value) || 0;
        const debt = Math.max(0, totalOrder - paid);
        const badge = document.getElementById('saleDebtStatusBadge');
        if (badge) {
          if (debt === 0) {
            badge.style.background = '#dcfce7';
            badge.style.color = '#15803d';
            badge.innerHTML = '✅ Payé à 100% (Aucune dette)';
          } else if (paid > 0) {
            badge.style.background = '#fef3c7';
            badge.style.color = '#b45309';
            badge.innerHTML = `⚠️ Acompte : Reste ${debt.toLocaleString('fr-FR')} ${curr} dû`;
          } else {
            badge.style.background = '#fee2e2';
            badge.style.color = '#b91c1c';
            badge.innerHTML = `🔴 Dette : ${debt.toLocaleString('fr-FR')} ${curr} à crédit`;
          }
        }
      }
    }

    function setQuickSalePaid(type) {
      let totalItems = 0;
      (window.currentSaleRows || []).forEach(r => {
        totalItems += ((r.quantity || 1) * (r.unitPrice || 0));
      });
      const mode = document.getElementById('sale_delivery_mode')?.value;
      const feeInput = document.getElementById('sale_delivery_fee');
      const deliveryFee = (mode === 'LIVRAISON_DOMICILE' && feeInput) ? (parseFloat(feeInput.value) || 0) : 0;
      const totalOrder = totalItems + deliveryFee;

      const paidInput = document.getElementById('sale_amount_paid');
      if (paidInput) {
        paidInput.dataset.modified = 'true';
        if (type === 'FULL') paidInput.value = totalOrder;
        else if (type === 'ZERO') paidInput.value = 0;
        calculateSaleTotals(false);
      }
    }

    async function handleSaveDirectSale(e) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        if (submitBtn.disabled) return;
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Enregistrement...';
      }
      const customerName = document.getElementById('sale_customer_name').value.trim();
      const customerPhone = document.getElementById('sale_customer_phone').value.trim();
      const deliveryMode = document.getElementById('sale_delivery_mode').value;
      const deliveryFee = deliveryMode === 'LIVRAISON_DOMICILE' ? (parseFloat(document.getElementById('sale_delivery_fee').value) || 0) : 0;
      const amountPaid = parseFloat(document.getElementById('sale_amount_paid').value) || 0;
      const paymentMethod = document.getElementById('sale_payment_method').value;
      const notes = document.getElementById('sale_notes').value.trim();

      const products = appData.products || [];
      const items = window.currentSaleRows.map(r => {
        const prod = products.find(p => p.id === r.productId);
        return {
          productId: r.productId,
          productName: prod ? prod.name : 'Article',
          quantity: r.quantity || 1,
          unitPrice: r.unitPrice || 0
        };
      });

      const payload = {
        orderSource: 'DIRECTE',
        customerName: customerName,
        customerPhone: customerPhone,
        customerAddress: deliveryMode === 'VENTE_DIRECTE' ? 'Vente sur place / Maison' : (customerPhone ? 'Livraison client' : 'Lomé'),
        deliveryMode: deliveryMode,
        deliveryFee: deliveryFee,
        items: items,
        amountPaid: amountPaid,
        paymentMethod: paymentMethod,
        notes: notes,
        registeredBy: (typeof currentUser !== 'undefined' && currentUser) ? currentUser.name : 'Ange Ines'
      };

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.success) {
          closeModal();
          const order = json.order;
          if (order.remainingAmount > 0) {
            showToast(`✅ Vente ${order.id} enregistrée ! Acompte : ${order.amountPaid} F | Dette enregistrée : ${order.remainingAmount} F`);
          } else {
            showToast(`✅ Vente ${order.id} enregistrée et payée à 100% ! (${order.totalOrder} F)`);
          }
          await loadData();
          if (currentView === 'DEBTS' && order.remainingAmount > 0) switchView('DEBTS');
          else switchView('ORDERS');
        } else {
          alert('Erreur: ' + (json.error || 'Impossible d\'enregistrer la vente.'));
        }
      } catch (err) {
        alert('Erreur réseau : ' + err.message);
      }
    }

    async function handleSavePayment(e, orderId) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        if (submitBtn.disabled) return;
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Enregistrement...';
      }
      const amount = parseFloat(document.getElementById('pay_amount').value) || 0;
      const method = document.getElementById('pay_method').value;
      const note = document.getElementById('pay_note').value.trim();

      try {
        const res = await fetch('/api/orders/' + orderId + '/payments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: amount,
            method: method,
            note: note,
            registeredBy: (typeof currentUser !== 'undefined' && currentUser) ? currentUser.name : 'Ange Ines'
          })
        });
        const json = await res.json();
        if (json.success) {
          closeModal();
          const o = json.order;
          if (o.remainingAmount === 0) {
            showToast(`🎉 Dette ${o.id} entièrement soldée ! (+ ${amount} F en caisse)`);
          } else {
            showToast(`✅ Versement de ${amount} F enregistré ! Nouveau reste dû : ${o.remainingAmount} F`);
          }
          await loadData();
          if (currentView === 'DEBTS') switchView('DEBTS');
          else if (currentView === 'ORDERS') switchView('ORDERS');
        } else {
          alert('Erreur: ' + (json.error || 'Impossible d\'enregistrer le paiement.'));
        }
      } catch (err) {
        alert('Erreur réseau: ' + err.message);
      }
    }

                <span style="font-weight:700; color:#166534; font-size:0.85rem;">Nouveau Total Articles :</span>
                <strong id="editOrderTotalPreview" style="font-size:1.25rem; color:#15803d;">${total.toLocaleString('fr-FR')} ${curr}</strong>
              </div>

              <div class="modal-foot" style="padding:0; display:flex; justify-content:space-between;">
                <button type="button" class="btn-secondary" onclick="openOrderDetailModal('${o.id}')">Annuler</button>
                <button type="submit" class="btn-primary-modal" style="background:#10b981; font-weight:800;">💾 Enregistrer & Ajuster les Stocks</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function addEditOrderItemRow() {
      const products = appData.products || [];
      const p = products[0] || { id: 1, name: 'Article', salePrice: 1000 };
      window.editingOrderItems.push({
        productId: p.id,
        productName: p.name,
        quantity: 1,
        unitPrice: p.isPromo ? p.promoPrice : p.salePrice
      });
      const o = (appData.orders || []).find(ord => ord.id === window.editingOrderId);
      if (o) renderEditOrderItemsModal(o);
    }

    function removeEditOrderItemRow(idx) {
      if (window.editingOrderItems.length <= 1) return;
      window.editingOrderItems.splice(idx, 1);
      const o = (appData.orders || []).find(ord => ord.id === window.editingOrderId);
      if (o) renderEditOrderItemsModal(o);
    }

    function updateEditOrderItemProd(idx, prodId) {
      const pId = parseInt(prodId);
      const p = (appData.products || []).find(prod => prod.id === pId);
      if (p) {
        window.editingOrderItems[idx].productId = pId;
        window.editingOrderItems[idx].productName = p.name;
        window.editingOrderItems[idx].unitPrice = p.isPromo ? p.promoPrice : p.salePrice;
      }
      const o = (appData.orders || []).find(ord => ord.id === window.editingOrderId);
      if (o) renderEditOrderItemsModal(o);
    }

    function updateEditOrderItemField(idx, field, val) {
      if (field === 'quantity') window.editingOrderItems[idx].quantity = parseInt(val) || 1;
      else if (field === 'unitPrice') window.editingOrderItems[idx].unitPrice = parseFloat(val) || 0;
      let total = 0;
      window.editingOrderItems.forEach(it => { total += (it.quantity || 1) * (it.unitPrice || 0); });
      const prev = document.getElementById('editOrderTotalPreview');
      const curr = appData.settings.currency || 'FCFA';
      if (prev) prev.textContent = total.toLocaleString('fr-FR') + ' ' + curr;
    }

    async function handleSaveOrderItems(e, orderId) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Enregistrement...';
      }
      try {
        const res = await fetch('/api/orders/' + orderId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: window.editingOrderItems })
        });
        const json = await res.json();
        if (json.success) {
          showToast('✅ Articles de la commande mis à jour et stocks ajustés !');
          await loadData();
          openOrderDetailModal(orderId);
        } else {
          alert('Erreur: ' + (json.error || 'Impossible de mettre à jour'));
        }
      } catch (err) {
        alert('Erreur réseau: ' + err.message);
      }
    }

    async function deleteOrder(orderId) {
      const o = (appData.orders || []).find(ord => ord.id === orderId);
      const name = o ? (' (' + o.id + ' - ' + o.customerName + ')') : (' (' + orderId + ')');
      if (!confirm('Supprimer cette commande/vente' + name + ' ? Les articles vendus seront automatiquement remis en stock.')) return;
      try {
        const res = await fetch('/api/orders/' + orderId, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          showToast('✅ Commande supprimée et stock restauré.');
          await loadData();
          if (currentView === 'DEBTS') switchView('DEBTS');
          else switchView('ORDERS');
        } else {
          alert('Erreur: ' + (json.error || 'Impossible de supprimer.'));
        }
      } catch (err) {
        alert('Erreur réseau: ' + err.message);
      }
    }
  
  </script>
</body>
</html>
