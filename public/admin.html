<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
  <title>Maison Angy - Espace de Gestion & Caisse</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    /* Login screen styling */
    .login-container {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; z-index: 10000;
    }
    .login-card {
      background: #ffffff; border-radius: 16px; width: 100%; max-width: 420px;
      padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      text-align: center; border-top: 4px solid #c59b27;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .login-logo {
      width: 60px; height: 60px; background: #0f172a; border: 2px solid #c59b27;
      border-radius: 50%; color: #c59b27; font-size: 1.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;
    }
    .toast-msg {
      position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff;
      padding: 12px 20px; border-radius: 8px; border-left: 4px solid #c59b27;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN (Visible if not authenticated) -->
  <div class="login-container" id="loginScreen" style="display: flex;">
    <div class="login-card">
      <img src="/images/logo.jpg" alt="Maison Angy" style="width:75px; height:75px; border-radius:50%; object-fit:cover; border:3px solid #c59b27; margin:0 auto 1.25rem; display:block; box-shadow:0 6px 20px rgba(197,155,39,0.35);" />
      <h2 style="font-size: 1.5rem; color: #0f172a; margin-bottom: 0.35rem;">Maison Angy</h2>
      <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.75rem;">Espace de Gestion & Caisse Privé</p>

      <form onsubmit="handleLogin(event)">
        <div style="text-align: left; margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; color: #334155;">
            Numéro de Téléphone
          </label>
          <input
            type="text"
            id="loginUsername"
            required
            placeholder="Ex: 93849200"
            value="93849200"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
          />
        </div>

        <div style="text-align: left; margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; color: #334155;">
            Mot de Passe
          </label>
          <input
            type="password"
            id="loginPassword"
            required
            placeholder="Entrez votre mot de passe"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
          />
        </div>

        <div id="loginError" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;">
          ⚠️ Identifiant ou mot de passe incorrect.
        </div>

        <button
          type="submit"
          class="btn-action-primary"
          style="width: 100%; padding: 0.8rem; justify-content: center; font-size: 1rem;"
        >
          Se Connecter à l'Espace
        </button>
      </form>

      <div style="margin-top: 1.5rem; font-size: 0.8rem; color: #94a3b8;">
        Accès réservé exclusivement à Ange Ines - Maison Angy
      </div>
    </div>
  </div>

  <!-- 2. MAIN APPLICATION INTERFACE -->
  <div id="appContainer" style="display: none; width: 100vw; height: 100vh; overflow: hidden;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="/images/logo.jpg" alt="Maison Angy" style="width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid #c59b27; margin-right:0.75rem; flex-shrink:0;" />
        <div class="sidebar-title">
          <h2 id="brandStoreName">Maison Angy</h2>
          <span style="color:#c59b27; font-size:0.72rem; font-weight:700;">COLLECTION</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" onclick="switchView('DASHBOARD')" id="nav-DASHBOARD">
          <span>📊</span>
          <span>Tableau de bord</span>
        </button>

        <button class="nav-item" onclick="switchView('ORDERS')" id="nav-ORDERS">
          <span>🛍️</span>
          <span>Commandes & Livraisons</span>
          <span class="nav-badge" id="pendingOrdersBadge" style="display:none;">0</span>
        </button>

        <button class="nav-item" onclick="switchView('DELIVERY_PERSONS')" id="nav-DELIVERY_PERSONS">
          <span>🛵</span>
          <span>Livreurs & Tarifs</span>
        </button>

        <button class="nav-item" onclick="switchView('PRODUCTS')" id="nav-PRODUCTS">
          <span>👗</span>
          <span>Stock & Articles</span>
        </button>

        <button class="nav-item" onclick="switchView('SHIPMENTS')" id="nav-SHIPMENTS">
          <span>📦</span>
          <span>Arrivages & Fournisseurs</span>
        </button>

        <button class="nav-item" onclick="switchView('TRIPS')" id="nav-TRIPS">
          <span>⛽</span>
          <span>Déplacements & Frais</span>
        </button>

        <button class="nav-item" onclick="switchView('CASH')" id="nav-CASH">
          <span>💰</span>
          <span>Caisse & Trésorerie</span>
        </button>

        <button class="nav-item" onclick="switchView('PROFITS')" id="nav-PROFITS">
          <span>📈</span>
          <span>Bénéfices & Rentabilité</span>
        </button>

        <button class="nav-item" onclick="switchView('TEAM')" id="nav-TEAM">
          <span>👥</span>
          <span>Équipe & Gérantes</span>
        </button>

        <button class="nav-item" onclick="switchView('SETTINGS')" id="nav-SETTINGS">
          <span>⚙️</span>
          <span>Configuration & Réseaux</span>
        </button>
      </nav>

      <div class="sidebar-footer" style="flex-direction: column; gap: 0.5rem;">
        <a href="/" target="_blank" class="btn-view-store">
          <span>↗️ Voir Boutique Cliente</span>
        </a>
        <button
          onclick="handleLogout()"
          style="background: transparent; border: 1px solid rgba(239,68,68,0.3); color: #ef4444; width: 100%; padding: 0.45rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;"
        >
          🚪 Déconnexion
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
          <div class="topbar-title" id="pageTitle">Tableau de Bord - Octobre 2026</div>
        </div>

        <div class="topbar-right">
          <div id="topUserBadge" style="font-size:0.85rem; color:#64748b; background:#f1f5f9; padding:0.4rem 0.8rem; border-radius:8px; display:inline-flex; align-items:center; gap:0.35rem;"></div>
          <div class="cash-pill" title="Trésorerie disponible en caisse">
            <span>🪙 Caisse : <strong id="topbarCash">81 500 FCFA</strong></span>
          </div>

          <div class="topbar-actions">
            <button class="btn-action-primary" onclick="openProductModal()">
              <span>+ Article</span>
            </button>
            <button class="btn-action-primary" style="background: #0f172a; color: #fff;" onclick="openDeliveryPersonModal()">
              <span>+ Livreur</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content-area" id="mainContent">
        <!-- Injected by renderView() -->
      </main>
    </div>
  </div>

  <!-- Global Modal Container -->
  <div id="modalContainer"></div>

  <!-- Client Script -->
  <script>
    let appData = {
      settings: { storeName: 'Maison Angy', currency: 'FCFA', currentCash: 81500, fullWhatsapp: '22893849200', whatsappNumber: '93849200' },
      products: [],
      orders: [],
      deliveryPersons: [],
      trips: [],
      cashTransactions: [],
      stats: {}
    };
    let currentView = 'DASHBOARD';
    window.deliverySubTab = window.deliverySubTab || 'ZONES';

    function switchDeliverySubTab(tab) {
      window.deliverySubTab = tab;
      renderView();
    }
    let orderFilter = 'ALL';

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = '✨ ' + msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // --- AUTHENTICATION ---
    function checkAuth() {
      const token = sessionStorage.getItem('angy_auth') || localStorage.getItem('angy_auth');
      if (token) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        applyRolePermissions();
        loadData();
      } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
      }
    }

    function getCurrentUser() {
      return JSON.parse(sessionStorage.getItem('angy_user') || localStorage.getItem('angy_user') || '{"role":"ADMIN","name":"Ange Ines"}');
    }

    function applyRolePermissions() {
      const u = getCurrentUser();
      const isAdmin = u.role === 'ADMIN';
      const perms = u.permissions || (isAdmin 
        ? { products: true, orders: true, delivery: true, trips: true, cash: true, profits: true, settings: true, team: true } 
        : { products: true, orders: true, delivery: true, trips: false, cash: false, profits: false, settings: false, team: false });

      const navProducts = document.getElementById('nav-PRODUCTS');
      const navOrders = document.getElementById('nav-ORDERS');
      const navDelivery = document.getElementById('nav-DELIVERY_PERSONS');
      const navTrips = document.getElementById('nav-TRIPS');
      const navCash = document.getElementById('nav-CASH');
      const navProfits = document.getElementById('nav-PROFITS');
      const navTeam = document.getElementById('nav-TEAM');
      const navShipments = document.getElementById('nav-SHIPMENTS');
      const navSettings = document.getElementById('nav-SETTINGS');
      const topCash = document.querySelector('.cash-pill');

      if (navProducts) navProducts.style.display = (isAdmin || perms.products !== false) ? 'flex' : 'none';
      if (navOrders) navOrders.style.display = (isAdmin || perms.orders !== false) ? 'flex' : 'none';
      if (navDelivery) navDelivery.style.display = (isAdmin || perms.delivery !== false) ? 'flex' : 'none';
      if (navTrips) navTrips.style.display = (isAdmin || perms.trips === true) ? 'flex' : 'none';
      if (navCash) navCash.style.display = (isAdmin || perms.cash === true) ? 'flex' : 'none';
      if (navProfits) navProfits.style.display = (isAdmin || perms.profits === true) ? 'flex' : 'none';
      if (navTeam) navTeam.style.display = isAdmin ? 'flex' : 'none';
      if (navShipments) navShipments.style.display = (isAdmin || perms.products !== false) ? 'flex' : 'none';
      if (navSettings) navSettings.style.display = (isAdmin || perms.settings === true) ? 'flex' : 'none';

      if (topCash) topCash.style.display = (isAdmin || perms.cash === true) ? 'inline-flex' : 'none';

      const userBadge = document.getElementById('topUserBadge');
      if (userBadge) {
        userBadge.innerHTML = isAdmin 
          ? '👑 <strong>' + (u.name || 'Ange Ines') + '</strong> (Propriétaire)'
          : '💼 <strong>' + (u.name || 'Collaboratrice') + '</strong> (' + (u.roleLabel || 'Gérante') + ')';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value.trim();
      const errBox = document.getElementById('loginError');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const d = await res.json();
        if (d.success) {
          sessionStorage.setItem('angy_auth', d.token);
          localStorage.setItem('angy_auth', d.token);
          sessionStorage.setItem('angy_user', JSON.stringify(d.user));
          localStorage.setItem('angy_user', JSON.stringify(d.user));
          errBox.style.display = 'none';
          checkAuth();
        } else {
          errBox.style.display = 'block';
          errBox.textContent = '⚠️ ' + (d.error || 'Identifiant ou mot de passe incorrect.');
        }
      } catch (err) {
        if (u === '93849200' && p === 'password2026') {
          sessionStorage.setItem('angy_auth', 'local_token');
          localStorage.setItem('angy_auth', 'local_token');
          checkAuth();
        } else {
          errBox.style.display = 'block';
        }
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('angy_auth');
      localStorage.removeItem('angy_auth');
      sessionStorage.removeItem('angy_user');
      localStorage.removeItem('angy_user');
      checkAuth();
    }

    async function toggleProductFeatured(id) {
      const p = appData.products.find(item => item.id === id);
      if (!p) return;
      await fetch('/api/products/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isFeatured: !p.isFeatured })
      });
      showToast(p.isFeatured ? 'Retiré de la mise en avant.' : '⭐ Article mis en avant sur la boutique !');
      loadData();
    }

    async function toggleProductPublished(id) {
      const p = appData.products.find(item => item.id === id);
      if (!p) return;
      const willPublish = p.published === false;
      await fetch('/api/products/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ published: willPublish })
      });
      showToast(willPublish ? '👁️ Article publié sur la boutique !' : 'Article masqué de la boutique.');
      loadData();
    }

    
    // 9. TEAM & GERANTES MANAGEMENT VIEW
    function renderTeamView() {
      const users = appData.users || [
        { id: 1, name: "Ange Ines", phone: "93849200", password: "password2026", role: "ADMIN", roleLabel: "Propriétaire & Administratrice" }
      ];

      return `
        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">👥 Gestion de l'Équipe & Accès Collaboratrices</div>
              <p style="color:#64748b; font-size:0.85rem; margin-top:0.25rem;">
                Créez les identifiants pour vos employées et choisissez exactement les fonctionnalités auxquelles elles ont accès (ajouter les articles quand vous n'êtes pas là, voir les commandes, etc. tout en gardant la caisse privée).
              </p>
            </div>
            <button class="btn-action-primary" onclick="openUserModal()">
              <span>+ Créer un Accès Employée</span>
            </button>
          </div>

          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Nom / Collaboratrice</th>
                  <th>Numéro (Identifiant)</th>
                  <th>Mot de passe</th>
                  <th>Poste & Rôle</th>
                  <th>Fonctionnalités Autorisées</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${users.map(u => `
                  <tr>
                    <td>
                      <strong style="color:#0f172a; font-size:0.95rem;">${u.name}</strong>
                      ${u.role === 'ADMIN' ? '<span style="margin-left:0.5rem; background:#fef3c7; color:#92400e; font-size:0.7rem; font-weight:bold; padding:2px 8px; border-radius:9999px;">PROPRIÉTAIRE</span>' : ''}
                    </td>
                    <td>
                      <span style="font-family:monospace; font-weight:600; font-size:0.95rem; color:#1e293b;">
                        📞 ${u.phone}
                      </span>
                    </td>
                    <td>
                      <span style="font-family:monospace; background:#f1f5f9; padding:2px 6px; border-radius:4px; font-size:0.85rem;">
                        ${u.password || '••••••••'}
                      </span>
                    </td>
                    <td>
                      <span style="font-size:0.85rem; font-weight:600; color:${u.role === 'ADMIN' ? '#c59b27' : '#2563eb'};">
                        ${u.roleLabel || (u.role === 'ADMIN' ? 'Propriétaire' : 'Gérante')}
                      </span>
                    </td>
                    <td>
                      <div style="font-size:0.82rem; font-weight:600;">
                        ${u.role === 'ADMIN' ? '<span style="color:#c59b27;">👑 Accès Total (Tous pouvoirs)</span>' : `
                          <div style="display:flex; flex-wrap:wrap; gap:4px;">
                            ${u.permissions?.products !== false ? '<span style="background:#e0f2fe; color:#0369a1; padding:2px 6px; border-radius:4px; font-size:0.75rem;">👗 Articles & Stock</span>' : ''}
                            ${u.permissions?.orders !== false ? '<span style="background:#dcfce7; color:#15803d; padding:2px 6px; border-radius:4px; font-size:0.75rem;">🛍️ Commandes</span>' : ''}
                            ${u.permissions?.delivery !== false ? '<span style="background:#fef3c7; color:#92400e; padding:2px 6px; border-radius:4px; font-size:0.75rem;">🛵 Livreurs</span>' : ''}
                            ${u.permissions?.trips ? '<span style="background:#f1f5f9; color:#475569; padding:2px 6px; border-radius:4px; font-size:0.75rem;">⛽ Déplacements</span>' : ''}
                            ${u.permissions?.cash ? '<span style="background:#d1fae5; color:#065f46; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold;">💰 Caisse</span>' : ''}
                            ${u.permissions?.profits ? '<span style="background:#fef3c7; color:#78350f; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold;">📈 Bénéfices</span>' : ''}
                          </div>
                        `}
                      </div>
                    </td>
                    <td style="text-align:right;">
                      ${u.role !== 'ADMIN' ? `
                        <button class="btn-sm-action" onclick="openUserModal(${u.id})" title="Modifier permissions">✏️ Modifier</button>
                        <button class="btn-sm-action danger" onclick="deleteUser(${u.id})" title="Supprimer">🗑️</button>
                      ` : `
                        <span style="font-size:0.75rem; color:#94a3b8; font-style:italic;">Compte Maître</span>
                      `}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openUserModal(userId) {
      const users = appData.users || [];
      const u = userId ? users.find(item => item.id === userId) : null;
      const perms = u ? (u.permissions || {}) : { products: true, orders: true, delivery: true, trips: false, cash: false, profits: false, settings: false };

      document.getElementById('modalContainer').innerHTML = `
        <div class="admin-modal-overlay active">
          <div class="admin-modal-card" style="max-width:550px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden;">
            <div class="modal-head" style="flex-shrink:0;">
              <h3>${u ? "Modifier l'Accès Employée" : "Créer un Compte Collaboratrice / Gérante"}</h3>
              <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form onsubmit="handleSaveUser(event, ${u ? u.id : 'null'})" style="display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden;">
              <div class="modal-body" style="overflow-y:auto; flex:1 1 auto; min-height:0; padding:1.25rem;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-bottom:0.75rem;">
                  <div>
                    <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Nom de l'employée *</label>
                    <input type="text" id="u_name" required value="${u ? u.name : ''}" placeholder="Ex: Akossiwa Gérante" style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>

                  <div>
                    <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Numéro Téléphone (Connexion) *</label>
                    <input type="text" id="u_phone" required value="${u ? u.phone : ''}" placeholder="Ex: 90123456" style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-bottom:0.75rem;">
                  <div>
                    <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Mot de passe de connexion *</label>
                    <input type="text" id="u_password" required value="${u ? u.password : 'gerante2026'}" style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>

                  <div>
                    <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Titre du poste</label>
                    <input type="text" id="u_roleLabel" value="${u ? (u.roleLabel || 'Gérante Boutique') : 'Gérante Boutique'}" style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>
                </div>

                <div style="margin-bottom:0.75rem;">
                  <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.3rem;">Rôle principal</label>
                  <select id="u_role" ${u && u.role === 'ADMIN' ? 'disabled' : ''} style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
                    <option value="GERANTE" ${!u || u.role === 'GERANTE' ? 'selected' : ''}>💼 Collaboratrice / Gérante (Accès personnalisé ci-dessous)</option>
                    <option value="ADMIN" ${u && u.role === 'ADMIN' ? 'selected' : ''}>👑 Administratrice (Accès Total Caisse & Bénéfices)</option>
                  </select>
                </div>

                <!-- SECTION CASES A COCHER DES FONCTIONNALITES -->
                <div style="background:#f8fafc; padding:1rem; border-radius:8px; border:1px solid #cbd5e1; margin-top:0.75rem;">
                  <label style="font-weight:700; color:#0f172a; margin-bottom:0.25rem; display:block; font-size:0.9rem;">
                    🛡️ Choisissez les fonctionnalités autorisées pour elle :
                  </label>
                  <p style="font-size:0.78rem; color:#64748b; margin-bottom:0.75rem;">
                    Cochez les sections que cette employée a le droit d'utiliser quand vous n'êtes pas là :
                  </p>

                  <div style="display:flex; flex-direction:column; gap:0.55rem;">
                    <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; font-weight:600; cursor:pointer;">
                      <input type="checkbox" id="perm_products" ${(perms.products !== false) ? 'checked' : ''} />

    async function handleSaveUser(e, id) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('u_name').value.trim(),
        phone: document.getElementById('u_phone').value.trim().replace(/[^0-9]/g, ''),
        password: document.getElementById('u_password').value.trim(),
        role: document.getElementById('u_role').value,
        roleLabel: document.getElementById('u_roleLabel').value.trim(),
        permissions: {
          products: document.getElementById('perm_products').checked,
          orders: document.getElementById('perm_orders').checked,
          delivery: document.getElementById('perm_delivery').checked,
          trips: document.getElementById('perm_trips').checked,
          cash: document.getElementById('perm_cash').checked,
          profits: document.getElementById('perm_profits').checked,
          settings: false
        }
      };

      const url = id ? '/api/users/' + id : '/api/users';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      closeModal();
      showToast('Compte employée et permissions enregistrés !');
      loadData();
    }

    async function deleteUser(id) {
      if (confirm('Voulez-vous vraiment supprimer cet accès gérante ?')) {
        await fetch('/api/users/' + id, { method: 'DELETE' });
        showToast('Accès gérante supprimé.');
        loadData();
      }
    }

    async function loadData() {
      try {
        const res = await fetch('/api/all');
        appData = await res.json();
        updateTopBar();
        renderView();
      } catch (e) {
        console.error('Erreur API:', e);

    function updateTopBar() {
      const cash = appData.settings?.currentCash !== undefined ? appData.settings.currentCash : 81500;
      const curr = appData.settings?.currency || 'FCFA';
      document.getElementById('topbarCash').textContent = cash.toLocaleString('fr-FR') + ' ' + curr;
      document.getElementById('brandStoreName').textContent = appData.settings?.storeName || 'Maison Angy';

      const pending = (appData.orders || []).filter(o => o.status !== 'LIVRE' && o.status !== 'ANNULE').length;
      const badge = document.getElementById('pendingOrdersBadge');
      if (pending > 0) {
        badge.style.display = 'inline-block';

        'SETTINGS': 'Configuration & WhatsApp'

      document.getElementById('sidebar').classList.remove('open');
      renderView();

      else if (currentView === 'PRODUCTS') c.innerHTML = renderProducts();
      else if (currentView === 'TRIPS') c.innerHTML = renderTrips();
      else if (currentView === 'CASH') c.innerHTML = renderCash();
      else if (currentView === 'PROFITS') c.innerHTML = renderProfits();
      else if (currentView === 'SHIPMENTS') c.innerHTML = renderShipmentsView();

    async function handleLogoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      showToast('⏳ Envoi du logo...');
      try {
        const compressed = await compressImage(file, 800, 0.9);
        const url = await uploadImageToServer(compressed, file.name);
        const input = document.getElementById('cfg_logoUrl');
        const prev = document.getElementById('cfg_logo_preview');
        if (input) input.value = url;
        if (prev) prev.src = url;
        showToast('✅ Logo sélectionné ! Cliquez sur Enregistrer pour valider.');
      } catch (err) {
        alert('Erreur upload logo: ' + err.message);
      } finally {
        event.target.value = '';
      }
    }

    async function handleSaveSettings(e) {
      e.preventDefault();
      const payload = {
        storeName: document.getElementById('cfg_storeName').value,
        slogan: document.getElementById('cfg_slogan').value,
        facebookUrl: document.getElementById('cfg_facebookUrl').value,
        tiktokUrl: document.getElementById('cfg_tiktokUrl').value,
        instagramUrl: document.getElementById('cfg_instagramUrl').value,
        whatsappCountryCode: document.getElementById('cfg_countryCode').value,
        whatsappNumber: document.getElementById('cfg_whatsappNumber').value,
        adminPassword: document.getElementById('cfg_password').value
      };
      await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      showToast('Paramètres mis à jour !');
      loadData();
    }

    // IMAGE COMPRESSION & DIRECT UPLOAD UTILITIES
    function compressImage(file, maxWidth = 1200, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth || h > maxWidth) {
              if (w > h) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              } else {
                w = Math.round((w * maxWidth) / h);
                h = maxWidth;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadImageToServer(dataUrl, originalName) {
      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: dataUrl, name: originalName })
        });
        if (res.ok) {
          const json = await res.json();
          if (json && json.success && json.url) return json.url;
        }
      } catch (err) {
        console.warn('Upload API unreachable, using local dataUrl:', err);
      }
      return dataUrl;
    }

    async function handleBulkImageUpload(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const progress = document.getElementById('uploadProgressIndicator');
      if (progress) {
        progress.style.display = 'inline-block';
        progress.textContent = '⏳ Optimisation et envoi de vos photos...';
      }

      try {
        const uploadedUrls = [];
        for (let i = 0; i < files.length && uploadedUrls.length < 5; i++) {
          if (progress) {
            progress.textContent = `⏳ Photo ${i + 1} sur ${Math.min(files.length, 5)} en cours d'envoi...`;
          }
          const compressed = await compressImage(files[i]);
          const url = await uploadImageToServer(compressed, files[i].name);
          uploadedUrls.push(url);
        }

        // Check if currently holding dummy unsplash photos
        const isDefault = window.productModalImages.every(img => img.includes('unsplash.com'));
        if (isDefault) {
          window.productModalImages = uploadedUrls;
        } else {
          window.productModalImages = [...window.productModalImages, ...uploadedUrls].slice(0, 5);
        }

        while (window.productModalImages.length < 2) {
          window.productModalImages.push(window.productModalImages[0] || '/images/logo.jpg');
        }

        window.productModalCoverIndex = 0;
        renderAdminImageSlots();
        showToast(`✅ ${uploadedUrls.length} photo(s) ajoutée(s) directement avec succès !`);
      } catch (err) {
        alert('Erreur lors de l\'envoi: ' + err.message);
      } finally {
        if (progress) progress.style.display = 'none';
        event.target.value = '';
      }
    }

    async function handleSingleSlotUpload(idx, event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      showToast('⏳ Envoi de la photo...');
      try {
        const compressed = await compressImage(file);
        const url = await uploadImageToServer(compressed, file.name);
        window.productModalImages[idx] = url;
        renderAdminImageSlots();
        showToast(`✅ Photo #${idx + 1} mise à jour avec succès !`);
      } catch (err) {
        alert('Erreur: ' + err.message);
      } finally {
        event.target.value = '';
      }
    }

    function renderAdminImageSlots() {
      const container = document.getElementById('adminImageSlotsContainer');
      if (!container) return;
      const countBadge = document.getElementById('adminImgCountBadge');
      const addBtn = document.getElementById('btnAdminAddImg');

      if (countBadge) {
        countBadge.textContent = `(${window.productModalImages.length} / 5 photos)`;
      }
      if (addBtn) {
        addBtn.style.display = window.productModalImages.length >= 5 ? 'none' : 'inline-flex';
      }

      container.innerHTML = window.productModalImages.map((url, idx) => {
        const isCover = idx === window.productModalCoverIndex;
        return `
          <div style="display:flex; align-items:center; gap:0.6rem; background:#fff; padding:0.6rem 0.8rem; border-radius:8px; border:${isCover ? '2px solid #c59b27' : '1px solid #cbd5e1'}; box-shadow:${isCover ? '0 2px 8px rgba(197,155,39,0.2)' : 'none'}; flex-wrap:wrap;">
            <div style="width:52px; height:52px; border-radius:6px; overflow:hidden; background:#f1f5f9; border:1px solid #e2e8f0; flex-shrink:0; display:flex; align-items:center; justify-content:center;">

            </div>

            <div style="flex:1; min-width:180px; display:flex; flex-direction:column; gap:0.25rem;">
              <div style="display:flex; align-items:center; gap:0.4rem;">
                <input type="file" id="slotFile_${idx}" accept="image/*" style="display:none;" onchange="handleSingleSlotUpload(${idx}, event)" />
                <button type="button" onclick="document.getElementById('slotFile_${idx}').click()" class="btn-sm-action primary" style="font-size:0.75rem; padding:0.35rem 0.65rem;">
                  📷 Remplacer cette photo
                </button>
                <span style="font-size:0.75rem; color:#64748b;">Photo #${idx + 1}</span>
              </div>
              <input type="text" value="${url}" placeholder="URL ou chemin de l'image" oninput="adminUpdateSlotUrl(${idx}, this.value)" style="width:100%; padding:0.35rem 0.5rem; border:1px solid #e2e8f0; border-radius:4px; font-size:0.75rem; color:#64748b;" />
            </div>

            <div style="display:flex; align-items:center; gap:0.4rem;">
              <button type="button" onclick="adminSetCoverImage(${idx})" style="padding:0.45rem 0.75rem; border-radius:6px; font-size:0.75rem; font-weight:700; cursor:pointer; border:none; transition:all 0.2s; white-space:nowrap; ${isCover ? 'background:#c59b27; color:#fff;' : 'background:#f1f5f9; color:#475569; border:1px solid #cbd5e1;'}">
                ${isCover ? '⭐ En avant (Couverture)' : 'Mettre en avant'}
              </button>

              ${window.productModalImages.length > 2 ? `
                <button type="button" onclick="adminRemoveImageSlot(${idx})" style="background:#fee2e2; color:#b91c1c; border:none; border-radius:6px; width:32px; height:32px; cursor:pointer; font-size:0.85rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;" title="Retirer cette photo">

                </button>
              ` : `
                <div style="width:32px; height:32px; flex-shrink:0;" title="Minimum 2 images requises"></div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function adminAddImageSlot() {
      if (window.productModalImages.length >= 5) {
        showToast('Maximum 5 images autorisées par article.');
        return;
      }
      window.productModalImages.push('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&auto=format&fit=crop&q=80');
      renderAdminImageSlots();
    }

    function adminRemoveImageSlot(idx) {
      if (window.productModalImages.length <= 2) {
        showToast('Au moins 2 images sont nécessaires pour présenter l\'article sous plusieurs angles.');
        return;
      }
      window.productModalImages.splice(idx, 1);
      if (window.productModalCoverIndex >= window.productModalImages.length) {
        window.productModalCoverIndex = 0;
      } else if (window.productModalCoverIndex === idx) {
        window.productModalCoverIndex = 0;
      }
      renderAdminImageSlots();
    }

    function adminSetCoverImage(idx) {
      window.productModalCoverIndex = idx;
      renderAdminImageSlots();
      showToast('Photo #' + (idx + 1) + ' définie comme image principale en avant !');
    }

    function adminUpdateSlotUrl(idx, val) {
      window.productModalImages[idx] = val.trim();
      const prev = document.getElementById('adminPreview_' + idx);
      if (prev) {
        prev.src = val.trim() || '/images/logo.jpg';
      }
    }

    async function handleSaveProduct(e, id) {
      e.preventDefault();

      // Validate images (2 to 5 images)
      const cleanImages = window.productModalImages.map(img => (img || '').trim()).filter(Boolean);
      if (cleanImages.length < 2) {
        alert('Veuillez renseigner au moins 2 photos pour cet article (2 à 5 photos requises).');
        return;
      }

      let covIdx = window.productModalCoverIndex;
      if (covIdx < 0 || covIdx >= cleanImages.length) {
        covIdx = 0;
      }
      const coverImage = cleanImages[covIdx] || cleanImages[0];

      const payload = {
        name: document.getElementById('p_name').value,
        category: document.getElementById('p_category').value,
        stock: parseInt(document.getElementById('p_stock').value) || 0,
        costPrice: parseFloat(document.getElementById('p_cost').value) || 0,
        salePrice: parseFloat(document.getElementById('p_sale').value) || 0,
        promoPrice: parseFloat(document.getElementById('p_promo').value) || 0,
        isPromo: document.getElementById('p_isPromo').checked,
        isFeatured: document.getElementById('p_isFeatured').checked,
        published: document.getElementById('p_published').checked,
        description: (document.getElementById('p_description') ? document.getElementById('p_description').value.trim() : ''),
        price3: document.getElementById('p_price3') && document.getElementById('p_price3').value ? parseFloat(document.getElementById('p_price3').value) : null,
        price6: document.getElementById('p_price6') && document.getElementById('p_price6').value ? parseFloat(document.getElementById('p_price6').value) : null,
        price12: document.getElementById('p_price12') && document.getElementById('p_price12').value ? parseFloat(document.getElementById('p_price12').value) : null,
        image: coverImage,
        images: cleanImages,
        coverIndex: covIdx
      };

      const url = id ? `/api/products/${id}` : '/api/products';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      closeModal();
      showToast('Article et photos enregistrés avec succès !');
      loadData();
    }

                      <span style="font-family:monospace; font-weight:800; color:#c59b27; font-size:0.95rem;">
                        ${s.number}
                      </span>
                    </td>
                    <td>
                      <span style="color:#475569; font-size:0.85rem; font-weight:600;">${s.date}</span>
                    </td>
                    <td>
                      <strong style="color:#0f172a;">${s.supplier}</strong>
                    </td>
                    <td>
                      <div style="font-size:0.82rem; color:#475569; max-width:240px;">
                        ${(s.items || []).map(it => `${it.productName} (+${it.quantity})`).join(', ')}
                      </div>
                    </td>
                    <td>
                      <span style="background:#e0f2fe; color:#0369a1; padding:3px 8px; border-radius:9999px; font-weight:700; font-size:0.85rem;">
                        +${s.totalQuantity} pcs
                      </span>
                    </td>
                    <td>
                      <strong style="color:#0f172a;">${(s.totalCost || 0).toLocaleString('fr-FR')} ${curr}</strong>
                    </td>
                    <td>
                      <span style="font-size:0.82rem; color:#64748b;">${s.registeredBy || 'Ange Ines'}</span>
                    </td>
                    <td style="text-align:right;">
                      <button class="btn-sm-action primary" onclick="openShipmentDetailModal(${s.id})" title="Voir le bordereau complet">
                        👁️ Bordereau
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Modal Nouvel Arrivage (Style Hiboutik)
    window.currentShipmentRows = [];

    function openNewShipmentModal(preselectProdId) {
      const products = appData.products || [];
      if (products.length === 0) {
        alert('Veuillez d\'abord créer au moins un article dans votre catalogue avant d\'enregistrer un arrivage.');
        openProductModal();
        return;
      }

      const selectedProd = preselectProdId ? (products.find(p => p.id === preselectProdId) || products[0]) : products[0];
      const shipments = appData.shipments || [];
      const nextNum = 'ARR-' + new Date().getFullYear() + '-' + String(shipments.length + 1).padStart(3, '0');
      const today = new Date().toISOString().split('T')[0];

      // Initialiser avec le produit sélectionné
      window.currentShipmentRows = [
        {
          productId: selectedProd.id,
          quantity: 10,
          costPrice: selectedProd.costPrice || 3000,
          salePrice: selectedProd.salePrice || 6500
        }
      ];

      document.getElementById('modalContainer').innerHTML = `
        <div class="admin-modal-overlay active">
          <div class="admin-modal-card" style="max-width:750px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden;">
            <div class="modal-head" style="flex-shrink:0;">
              <div>
                <h3>📦 Nouvel Arrivage Fournisseur (Type Hiboutik)</h3>
                <div style="font-size:0.8rem; color:#64748b; margin-top:2px;">Le stock sera incrémenté automatiquement selon les quantités reçues</div>
              </div>
              <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <form onsubmit="handleSaveShipment(event)" style="display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden;">
              <div class="modal-body" style="overflow-y:auto; flex:1 1 auto; min-height:0; padding:1.25rem;">
                <!-- INFOS FOURNISSEUR & ARREST -->
                <div style="display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:0.75rem; margin-bottom:1rem; background:#f8fafc; padding:0.85rem; border-radius:8px; border:1px solid #cbd5e1;">
                  <div>
                    <label style="display:block; font-weight:600; font-size:0.82rem; margin-bottom:0.25rem;">N° Arrivage *</label>
                    <input type="text" id="ship_number" required value="${nextNum}" style="width:100%; padding:0.5rem; border:1px solid #cbd5e1; border-radius:6px; font-weight:700; color:#c59b27;" />
                  </div>
                  <div>
                    <label style="display:block; font-weight:600; font-size:0.82rem; margin-bottom:0.25rem;">Nom Fournisseur *</label>
                    <input type="text" id="ship_supplier" required placeholder="Ex: Grossiste Assigamé, Cotonou, Chine..." value="Grossiste Assigamé (Lomé)" style="width:100%; padding:0.5rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>
                  <div>
                    <label style="display:block; font-weight:600; font-size:0.82rem; margin-bottom:0.25rem;">Date Réception *</label>
                    <input type="date" id="ship_date" required value="${today}" style="width:100%; padding:0.5rem; border:1px solid #cbd5e1; border-radius:6px;" />
                  </div>
                </div>

                <!-- LIGNES DES ARTICLES RECUS -->
                <div style="margin-bottom:0.75rem; display:flex; justify-content:space-between; align-items:center;">
                  <label style="font-weight:700; color:#0f172a; font-size:0.9rem;">
                    📋 Articles Reçus dans cet arrivage :
                  </label>
                  <button type="button" onclick="addShipmentRow()" class="btn-sm-action primary" style="padding:0.35rem 0.75rem; font-size:0.8rem;">
                    + Ajouter un article
                  </button>
                </div>

                <div id="shipmentRowsContainer" style="display:flex; flex-direction:column; gap:0.6rem; max-height:280px; overflow-y:auto; padding-right:4px;">
                  <!-- Rendu dynamique des lignes d'articles -->
                </div>

                <!-- TOTAL GENERAL RECAP -->
                <div style="margin-top:1rem; padding:0.85rem 1.1rem; background:#f0fdf4; border:1.5px solid #86efac; border-radius:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                  <div>
                    <div style="font-size:0.8rem; color:#166534; font-weight:600;">Total Pièces Reçues :</div>
                    <div id="shipTotalQtyPreview" style="font-size:1.3rem; font-weight:800; color:#15803d;">0 pièces</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-size:0.8rem; color:#166534; font-weight:600;">Montant Total Coût d'Achat :</div>
                    <div id="shipTotalCostPreview" style="font-size:1.3rem; font-weight:800; color:#15803d;">0 FCFA</div>
                  </div>
                </div>

                <!-- NOTES BORDEREAU -->
                <div style="margin-top:0.75rem;">
                  <label style="display:block; font-weight:600; font-size:0.82rem; margin-bottom:0.25rem;">Notes / Référence Colis (facultatif)</label>
                  <input type="text" id="ship_notes" placeholder="Ex: Carton N°2, livré par moto-taxi, frais transport inclus..." style="width:100%; padding:0.5rem; border:1px solid #cbd5e1; border-radius:6px; font-size:0.85rem;" />
                </div>

              </div>
              <div class="modal-foot">
                <button type="button" class="btn-secondary" onclick="closeModal()">Annuler</button>
                <button type="submit" class="btn-primary-modal" style="background:#10b981;">
                  ✅ Valider l'Arrivage & Incrémenter les Stocks
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
      renderShipmentRows();
    }

    function renderShipmentRows() {
      const container = document.getElementById('shipmentRowsContainer');
      if (!container) return;
      const products = appData.products || [];
      const curr = appData.settings.currency || 'FCFA';

      let totalQty = 0;
      let totalCost = 0;

      container.innerHTML = window.currentShipmentRows.map((row, idx) => {
        const prod = products.find(p => p.id === row.productId) || products[0];
        const lineTotal = (row.quantity || 0) * (row.costPrice || 0);
        totalQty += (row.quantity || 0);
        totalCost += lineTotal;

        return `
          <div style="display:grid; grid-template-columns:2.5fr 1fr 1.2fr 1.2fr auto; gap:0.5rem; align-items:center; background:#fff; padding:0.55rem 0.75rem; border:1px solid #cbd5e1; border-radius:6px;">
            <div>
              <label style="display:block; font-size:0.7rem; color:#64748b; font-weight:600;">Article sélectionné</label>
              <select onchange="updateShipmentRowProduct(${idx}, this.value)" style="width:100%; padding:0.45rem; border:1px solid #cbd5e1; border-radius:4px; font-size:0.82rem; font-weight:600;">
                ${products.map(p => `
                  <option value="${p.id}" ${p.id === row.productId ? 'selected' : ''}>
                    ${p.name} (Stock actuel: ${p.stock} pcs)
                  </option>
                `).join('')}
              </select>
            </div>

            <div>
              <label style="display:block; font-size:0.7rem; color:#64748b; font-weight:600;">Quantité reçue</label>
              <input type="number" min="1" value="${row.quantity}" oninput="updateShipmentRowField(${idx}, 'quantity', this.value)" style="width:100%; padding:0.45rem; border:1px solid #cbd5e1; border-radius:4px; font-size:0.85rem; font-weight:700; color:#2563eb;" />
            </div>

            <div>
              <label style="display:block; font-size:0.7rem; color:#64748b; font-weight:600;">Prix d'Achat payé (${curr})</label>
              <input type="number" min="0" value="${row.costPrice}" oninput="updateShipmentRowField(${idx}, 'costPrice', this.value)" style="width:100%; padding:0.45rem; border:1px solid #cbd5e1; border-radius:4px; font-size:0.85rem; font-weight:600;" />
            </div>

            <div>
              <label style="display:block; font-size:0.7rem; color:#64748b; font-weight:600;">Prix Vente habituel (${curr})</label>
              <input type="number" min="0" value="${row.salePrice}" oninput="updateShipmentRowField(${idx}, 'salePrice', this.value)" style="width:100%; padding:0.45rem; border:1px solid #cbd5e1; border-radius:4px; font-size:0.85rem; font-weight:600; color:#0f172a;" />
            </div>

            <div style="text-align:right; padding-top:1rem;">
              ${window.currentShipmentRows.length > 1 ? `
                <button type="button" onclick="removeShipmentRow(${idx})" style="background:#fee2e2; color:#b91c1c; border:none; border-radius:4px; width:28px; height:28px; cursor:pointer;" title="Retirer cette ligne">
                  ✕
                </button>
              ` : `
                <div style="width:28px; height:28px;"></div>
              `}
            </div>
          </div>
        `;
      }).join('');

      const qtyPreview = document.getElementById('shipTotalQtyPreview');
      const costPreview = document.getElementById('shipTotalCostPreview');
      if (qtyPreview) qtyPreview.textContent = `+${totalQty} pièces`;
      if (costPreview) costPreview.textContent = `${totalCost.toLocaleString('fr-FR')} ${curr}`;
    }

    function addShipmentRow() {
      const products = appData.products || [];
      window.currentShipmentRows.push({
        productId: products[0] ? products[0].id : 1,
        quantity: 10,
        costPrice: products[0] ? (products[0].costPrice || 3000) : 3000,
        salePrice: products[0] ? (products[0].salePrice || 6500) : 6500
      });
      renderShipmentRows();
    }

    function removeShipmentRow(idx) {
      if (window.currentShipmentRows.length <= 1) return;
      window.currentShipmentRows.splice(idx, 1);
      renderShipmentRows();
    }

    function updateShipmentRowProduct(idx, prodId) {
      const pId = parseInt(prodId);
      const prod = (appData.products || []).find(p => p.id === pId);
      if (prod) {
        window.currentShipmentRows[idx].productId = pId;
        window.currentShipmentRows[idx].costPrice = prod.costPrice || 3000;
        window.currentShipmentRows[idx].salePrice = prod.salePrice || 6500;
      }
      renderShipmentRows();
    }

    function updateShipmentRowField(idx, field, val) {
      window.currentShipmentRows[idx][field] = parseFloat(val) || 0;
      const curr = appData.settings.currency || 'FCFA';
      let totalQty = 0;
      let totalCost = 0;
      window.currentShipmentRows.forEach(r => {
        totalQty += (r.quantity || 0);
        totalCost += ((r.quantity || 0) * (r.costPrice || 0));
      });
      const qtyPreview = document.getElementById('shipTotalQtyPreview');
      const costPreview = document.getElementById('shipTotalCostPreview');
      if (qtyPreview) qtyPreview.textContent = `+${totalQty} pièces`;
      if (costPreview) costPreview.textContent = `${totalCost.toLocaleString('fr-FR')} ${curr}`;
    }

    async function handleSaveShipment(e) {
      e.preventDefault();
      const payload = {
        number: document.getElementById('ship_number').value.trim(),
        supplier: document.getElementById('ship_supplier').value.trim(),
        date: document.getElementById('ship_date').value,
        notes: document.getElementById('ship_notes').value.trim(),
        registeredBy: currentUser ? currentUser.name : 'Ange Ines',
        items: window.currentShipmentRows
      };

      try {
        const res = await fetch('/api/shipments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.success) {
          closeModal();
          showToast(`✅ Arrivage ${payload.number} enregistré ! Les stocks ont été augmentés.`);
          await loadData();
          if (currentView === 'SHIPMENTS') switchView('SHIPMENTS');
          else if (currentView === 'PRODUCTS') switchView('PRODUCTS');
        } else {
          alert('Erreur: ' + (json.error || 'Impossible d\'enregistrer l\'arrivage.'));
        }
      } catch (err) {
        alert('Erreur réseau lors de l\'enregistrement de l\'arrivage: ' + err.message);
      }
    }

    function openShipmentDetailModal(shipmentId) {
      const s = (appData.shipments || []).find(it => it.id === shipmentId);
      if (!s) return;
      const curr = appData.settings.currency || 'FCFA';

      document.getElementById('modalContainer').innerHTML = `
        <div class="admin-modal-overlay active">
          <div class="admin-modal-card" style="max-width:650px;">
            <div class="modal-head">
              <div>
                <h3>📦 Bordereau d'Arrivage : ${s.number}</h3>
                <div style="font-size:0.8rem; color:#64748b;">Réception du ${s.date} • Fournisseur : <strong>${s.supplier}</strong></div>
              </div>
              <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
              <div style="display:flex; justify-content:space-between; background:#f8fafc; padding:0.85rem; border-radius:6px; border:1px solid #cbd5e1; margin-bottom:1rem; font-size:0.85rem;">
                <div>
                  <span style="color:#64748b;">Enregistré par :</span> <strong>${s.registeredBy || 'Ange Ines'}</strong>
                </div>
                <div>
                  <span style="color:#64748b;">Total pièces :</span> <strong style="color:#2563eb;">+${s.totalQuantity} pcs</strong>
                </div>
                <div>
                  <span style="color:#64748b;">Coût d'achat total :</span> <strong style="color:#10b981;">${(s.totalCost || 0).toLocaleString('fr-FR')} ${curr}</strong>
                </div>
              </div>

              <div class="data-table-wrap" style="border:1px solid #e2e8f0; border-radius:6px;">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Article</th>
                      <th>Quantité</th>
                      <th>Prix d'Achat</th>
                      <th>Prix Vente Habituel</th>
                      <th>Total Ligne</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(s.items || []).map(it => `
                      <tr>
                        <td><strong>${it.productName}</strong></td>
                        <td><span style="font-weight:700; color:#2563eb;">+${it.quantity} pcs</span></td>
                        <td>${it.costPrice.toLocaleString('fr-FR')} ${curr}</td>
                        <td>${it.salePrice ? it.salePrice.toLocaleString('fr-FR') + ' ' + curr : '-'}</td>
                        <td><strong>${(it.totalCost || (it.quantity * it.costPrice)).toLocaleString('fr-FR')} ${curr}</strong></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              ${s.notes ? `
                <div style="margin-top:1rem; padding:0.75rem; background:#fffdf5; border:1px solid #fef3c7; border-radius:6px; font-size:0.85rem; color:#78350f;">
                  📝 <strong>Notes :</strong> ${s.notes}
                </div>
              ` : ''}
            </div>
            <div class="modal-foot">
              <button type="button" class="btn-primary-modal" onclick="closeModal()">Fermer</button>
            </div>
          </div>
        </div>
      `;
    }

  </script>
</body>
</html>
