<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
  <title>Maison Angy - Espace de Gestion & Caisse</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    /* Login screen styling */
    .login-container {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; z-index: 10000;
    }
    .login-card {
      background: #ffffff; border-radius: 16px; width: 100%; max-width: 420px;
      padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      text-align: center; border-top: 4px solid #c59b27;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .login-logo {
      width: 60px; height: 60px; background: #0f172a; border: 2px solid #c59b27;
      border-radius: 50%; color: #c59b27; font-size: 1.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;
    }
    .toast-msg {
      position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff;
      padding: 12px 20px; border-radius: 8px; border-left: 4px solid #c59b27;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN (Visible if not authenticated) -->
  <div class="login-container" id="loginScreen" style="display: flex;">
    <div class="login-card">
      <img src="/images/logo.jpg" alt="Maison Angy" style="width:75px; height:75px; border-radius:50%; object-fit:cover; border:3px solid #c59b27; margin:0 auto 1.25rem; display:block; box-shadow:0 6px 20px rgba(197,155,39,0.35);" />
      <h2 style="font-size: 1.5rem; color: #0f172a; margin-bottom: 0.35rem;">Maison Angy</h2>
      <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.75rem;">Espace de Gestion & Caisse Privé</p>

      <form onsubmit="handleLogin(event)">
        <div style="text-align: left; margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; color: #334155;">
            Numéro de Téléphone
          </label>
          <input
            type="text"
            id="loginUsername"
            required
            placeholder="Ex: 93849200"
            value="93849200"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
          />
        </div>

        <div style="text-align: left; margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; color: #334155;">
            Mot de Passe
          </label>
          <input
            type="password"
            id="loginPassword"
            required
            placeholder="Entrez votre mot de passe"
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
          />
        </div>

        <div id="loginError" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;">
          ⚠️ Identifiant ou mot de passe incorrect.
        </div>

        <button
          type="submit"
          class="btn-action-primary"
          style="width: 100%; padding: 0.8rem; justify-content: center; font-size: 1rem;"
        >
          Se Connecter à l'Espace
        </button>
      </form>

      <div style="margin-top: 1.5rem; font-size: 0.8rem; color: #94a3b8;">
        Accès réservé exclusivement à Ange Ines - Maison Angy
      </div>
    </div>
  </div>

  <!-- 2. MAIN APPLICATION INTERFACE -->
  <div id="appContainer" style="display: none; width: 100vw; height: 100vh; overflow: hidden;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="/images/logo.jpg" alt="Maison Angy" style="width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid #c59b27; margin-right:0.75rem; flex-shrink:0;" />
        <div class="sidebar-title">
          <h2 id="brandStoreName">Maison Angy</h2>
          <span style="color:#c59b27; font-size:0.72rem; font-weight:700;">COLLECTION</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" onclick="switchView('DASHBOARD')" id="nav-DASHBOARD">
          <span>📊</span>
          <span>Tableau de bord</span>
        </button>

        <button class="nav-item" onclick="switchView('ORDERS')" id="nav-ORDERS">
          <span>🛍️</span>
          <span>Commandes & Livraisons</span>
          <span class="nav-badge" id="pendingOrdersBadge" style="display:none;">0</span>
        </button>

        <button class="nav-item" onclick="switchView('DELIVERY_PERSONS')" id="nav-DELIVERY_PERSONS">
          <span>🛵</span>
          <span>Livreurs & Coursiers</span>
        </button>

        <button class="nav-item" onclick="switchView('PRODUCTS')" id="nav-PRODUCTS">
          <span>👗</span>
          <span>Stock & Articles</span>
        </button>

        <button class="nav-item" onclick="switchView('TRIPS')" id="nav-TRIPS">
          <span>⛽</span>
          <span>Déplacements & Frais</span>
        </button>

        <button class="nav-item" onclick="switchView('CASH')" id="nav-CASH">
          <span>💰</span>
          <span>Caisse & Trésorerie</span>
        </button>

        <button class="nav-item" onclick="switchView('PROFITS')" id="nav-PROFITS">
          <span>📈</span>
          <span>Bénéfices & Rentabilité</span>
        </button>

        <button class="nav-item" onclick="switchView('SETTINGS')" id="nav-SETTINGS">
          <span>⚙️</span>
          <span>Réglages WhatsApp</span>
        </button>
      </nav>

      <div class="sidebar-footer" style="flex-direction: column; gap: 0.5rem;">
        <a href="/" target="_blank" class="btn-view-store">
          <span>↗️ Voir Boutique Cliente</span>
        </a>
        <button
          onclick="handleLogout()"
          style="background: transparent; border: 1px solid rgba(239,68,68,0.3); color: #ef4444; width: 100%; padding: 0.45rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;"
        >
          🚪 Déconnexion
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
          <div class="topbar-title" id="pageTitle">Tableau de Bord - Octobre 2026</div>
        </div>

        <div class="topbar-right">
          <div id="topUserBadge" style="font-size:0.85rem; color:#64748b; background:#f1f5f9; padding:0.4rem 0.8rem; border-radius:8px; display:inline-flex; align-items:center; gap:0.35rem;"></div>
          <div class="cash-pill" title="Trésorerie disponible en caisse">
            <span>🪙 Caisse : <strong id="topbarCash">81 500 FCFA</strong></span>
          </div>

          <div class="topbar-actions">
            <button class="btn-action-primary" onclick="openProductModal()">
              <span>+ Article</span>
            </button>
            <button class="btn-action-primary" style="background: #0f172a; color: #fff;" onclick="openDeliveryPersonModal()">
              <span>+ Livreur</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content-area" id="mainContent">
        <!-- Injected by renderView() -->
      </main>
    </div>
  </div>

  <!-- Global Modal Container -->
  <div id="modalContainer"></div>

  <!-- Client Script -->
  <script>
    let appData = {
      settings: { storeName: 'Maison Angy', currency: 'FCFA', currentCash: 81500, fullWhatsapp: '22893849200', whatsappNumber: '93849200' },
      products: [],
      orders: [],
      deliveryPersons: [],
      trips: [],
      cashTransactions: [],
      stats: {}
    };
    let currentView = 'DASHBOARD';
    let orderFilter = 'ALL';

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = '✨ ' + msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // --- AUTHENTICATION ---
    function checkAuth() {
      const token = sessionStorage.getItem('angy_auth') || localStorage.getItem('angy_auth');
      if (token) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        applyRolePermissions();
        loadData();
      } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
      }
    }

    function getCurrentUser() {
      return JSON.parse(sessionStorage.getItem('angy_user') || localStorage.getItem('angy_user') || '{"role":"ADMIN","name":"Ange Ines"}');
    }

    function applyRolePermissions() {
      const u = getCurrentUser();
      const isAdmin = u.role === 'ADMIN';

      // Hide Cash and Profits menus for Gerante
      const cashNav = document.getElementById('nav-CASH');
      const profitsNav = document.getElementById('nav-PROFITS');
      const teamNav = document.getElementById('nav-TEAM');
      const topCash = document.querySelector('.cash-pill');

      if (cashNav) cashNav.style.display = isAdmin ? 'flex' : 'none';
      if (profitsNav) profitsNav.style.display = isAdmin ? 'flex' : 'none';
      if (teamNav) teamNav.style.display = isAdmin ? 'flex' : 'none';
      if (topCash) topCash.style.display = isAdmin ? 'inline-flex' : 'none';

      const userBadge = document.getElementById('topUserBadge');
      if (userBadge) {
        userBadge.innerHTML = isAdmin 
          ? '👑 <strong>' + (u.name || 'Ange Ines') + '</strong> (Propriétaire)'
          : '💼 <strong>' + (u.name || 'Gérante') + '</strong> (Gérante)';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value.trim();
      const errBox = document.getElementById('loginError');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const d = await res.json();
        if (d.success) {
          sessionStorage.setItem('angy_auth', d.token);
          localStorage.setItem('angy_auth', d.token);
          sessionStorage.setItem('angy_user', JSON.stringify(d.user));
          localStorage.setItem('angy_user', JSON.stringify(d.user));
          errBox.style.display = 'none';
          checkAuth();
        } else {
          errBox.style.display = 'block';
          errBox.textContent = '⚠️ ' + (d.error || 'Identifiant ou mot de passe incorrect.');
        }
      } catch (err) {
        if (u === '93849200' && p === 'password2026') {
          sessionStorage.setItem('angy_auth', 'local_token');
          localStorage.setItem('angy_auth', 'local_token');
          checkAuth();
        } else {
          errBox.style.display = 'block';
        }
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('angy_auth');
      localStorage.removeItem('angy_auth');
      sessionStorage.removeItem('angy_user');
      localStorage.removeItem('angy_user');
      checkAuth();
    }

    async function toggleProductFeatured(id) {
      const p = appData.products.find(item => item.id === id);
      if (!p) return;
      await fetch('/api/products/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isFeatured: !p.isFeatured })
      });
      showToast(p.isFeatured ? 'Retiré de la mise en avant.' : '⭐ Article mis en avant sur la boutique !');
      loadData();
    }

    async function toggleProductPublished(id) {
      const p = appData.products.find(item => item.id === id);
      if (!p) return;
      const willPublish = p.published === false;
      await fetch('/api/products/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ published: willPublish })
      });
      showToast(willPublish ? '👁️ Article publié sur la boutique !' : 'Article masqué de la boutique.');
      loadData();
    }

    
    // 9. TEAM & GERANTES MANAGEMENT VIEW
    function renderTeamView() {
      const users = appData.users || [
        { id: 1, name: "Ange Ines", phone: "93849200", password: "password2026", role: "ADMIN", roleLabel: "Propriétaire & Administratrice" }
      ];

      return `
        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">👥 Équipe & Comptes d'Accès</div>
              <p style="color:#64748b; font-size:0.85rem; margin-top:0.25rem;">
                En tant que propriétaire, vous pouvez créer ici des comptes pour vos gérantes de boutique avec leur propre numéro et mot de passe.
              </p>
            </div>
            <button class="btn-action-primary" onclick="openUserModal()">
              <span>+ Créer un Accès Gérante</span>
            </button>
          </div>

          <div style="overflow-x:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Nom / Collaboratrice</th>
                  <th>Numéro Téléphone (Identifiant)</th>
                  <th>Mot de passe</th>
                  <th>Rôle & Pouvoir</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${users.map(u => `
                  <tr>
                    <td>
                      <strong style="color:#0f172a; font-size:0.95rem;">${u.name}</strong>
                      ${u.role === 'ADMIN' ? '<span style="margin-left:0.5rem; background:#fef3c7; color:#92400e; font-size:0.7rem; font-weight:bold; padding:2px 8px; border-radius:9999px;">PROPRIÉTAIRE</span>' : ''}
                    </td>
                    <td>
                      <span style="font-family:monospace; font-weight:600; font-size:0.95rem; color:#1e293b;">
                        📞 ${u.phone}
                      </span>
                    </td>
                    <td>
                      <span style="font-family:monospace; background:#f1f5f9; padding:2px 6px; border-radius:4px; font-size:0.85rem;">
                        ${u.password || '••••••••'}
                      </span>
                    </td>
                    <td>
                      <span style="font-size:0.85rem; font-weight:600; color:${u.role === 'ADMIN' ? '#c59b27' : '#2563eb'};">
                        ${u.role === 'ADMIN' ? '👑 Accès Total (Caisse, Bénéfices, Direction)' : '💼 Ventes, Stocks & Commandes'}
                      </span>
                    </td>
                    <td style="text-align:right;">
                      <button class="btn-table-action" onclick="openUserModal(${u.id})" title="Modifier">✏️</button>
                      ${u.role !== 'ADMIN' ? `
                        <button class="btn-table-action" onclick="deleteUser(${u.id})" title="Supprimer" style="color:#ef4444;">🗑️</button>
                      ` : ''}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openUserModal(userId) {
      const users = appData.users || [];
      const u = userId ? users.find(item => item.id === userId) : null;

      document.getElementById('modalContainer').innerHTML = `
        <div class="admin-modal-overlay active">
          <div class="admin-modal-card" style="max-width:450px;">
            <div class="modal-header">
              <div class="modal-title">${u ? "Modifier le Compte" : "Créer un Nouvel Accès Gérante"}</div>
              <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form onsubmit="handleSaveUser(event, ${u ? u.id : 'null'})">
              <div class="modal-body">
                <div class="form-group">
                  <label class="form-label">Nom de la personne *</label>
                  <input type="text" class="form-input" id="u_name" required value="${u ? u.name : ''}" placeholder="Ex: Akossiwa Gérante" />
                </div>

                <div class="form-group">
                  <label class="form-label">Numéro de Téléphone (Identifiant de connexion) *</label>
                  <input type="text" class="form-input" id="u_phone" required value="${u ? u.phone : ''}" placeholder="Ex: 90123456" />
                </div>

                <div class="form-group">
                  <label class="form-label">Mot de passe de connexion *</label>
                  <input type="text" class="form-input" id="u_password" required value="${u ? u.password : 'gerante2026'}" />
                </div>

                <div class="form-group">
                  <label class="form-label">Rôle attribué</label>
                  <select class="form-input" id="u_role" ${u && u.role === 'ADMIN' ? 'disabled' : ''}>
                    <option value="GERANTE" ${!u || u.role === 'GERANTE' ? 'selected' : ''}>💼 Gérante (Ventes, Stocks, Commandes - Caisse masquée)</option>
                    <option value="ADMIN" ${u && u.role === 'ADMIN' ? 'selected' : ''}>👑 Administratrice (Accès Complet Caisse & Trésorerie)</option>
                  </select>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn-action-primary" style="background:#64748b;" onclick="closeModal()">Annuler</button>
                <button type="submit" class="btn-action-primary">Enregistrer le Compte</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    async function handleSaveUser(e, id) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('u_name').value.trim(),
        phone: document.getElementById('u_phone').value.trim().replace(/[^0-9]/g, ''),
        password: document.getElementById('u_password').value.trim(),
        role: document.getElementById('u_role').value
      };

      const url = id ? '/api/users/' + id : '/api/users';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      closeModal();
      showToast('Compte enregistré avec succès !');
      loadData();
    }

    async function deleteUser(id) {
      if (confirm('Voulez-vous vraiment supprimer cet accès gérante ?')) {
        await fetch('/api/users/' + id, { method: 'DELETE' });
        showToast('Accès gérante supprimé.');
        loadData();
      }
    }

    // --- DATA ---
    async function loadData() {
      try {
        const res = await fetch('/api/all');
        appData = await res.json();
        updateTopBar();
        renderView();
      } catch (e) {
        console.error('Erreur API:', e);
      }
    }

    function updateTopBar() {
      const cash = appData.settings?.currentCash !== undefined ? appData.settings.currentCash : 81500;
      const curr = appData.settings?.currency || 'FCFA';
      document.getElementById('topbarCash').textContent = cash.toLocaleString('fr-FR') + ' ' + curr;
      document.getElementById('brandStoreName').textContent = appData.settings?.storeName || 'Maison Angy';

      const pending = (appData.orders || []).filter(o => o.status !== 'LIVRE' && o.status !== 'ANNULE').length;
      const badge = document.getElementById('pendingOrdersBadge');
      if (pending > 0) {
        badge.style.display = 'inline-block';
        badge.textContent = pending;
      } else {
        badge.style.display = 'none';
      }
    }

    function switchView(viewName) {
      currentView = viewName;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeBtn = document.getElementById('nav-' + viewName);
      if (activeBtn) activeBtn.classList.add('active');

      const titles = {
        'DASHBOARD': 'Tableau de Bord - Octobre 2026',
        'ORDERS': 'Commandes, Livraisons & Expéditions',
        'DELIVERY_PERSONS': 'Annuaire des Livreurs & Coursiers',
        'PRODUCTS': 'Stock & Nouveaux Articles',
        'TRIPS': 'Déplacements & Frais Logistiques',
        'CASH': 'Journal de Caisse & Trésorerie',
        'PROFITS': 'Bénéfices & Rentabilité',
        'TEAM': 'Gestion de l\'Équipe & Accès Gérantes',
        'SETTINGS': 'Configuration & WhatsApp'
      };
      document.getElementById('pageTitle').textContent = titles[viewName] || viewName;
      document.getElementById('sidebar').classList.remove('open');
      renderView();
    }

    function renderView() {
      const c = document.getElementById('mainContent');
      if (currentView === 'DASHBOARD') c.innerHTML = renderDashboard();
      else if (currentView === 'ORDERS') c.innerHTML = renderOrders();
      else if (currentView === 'DELIVERY_PERSONS') c.innerHTML = renderDeliveryPersons();
      else if (currentView === 'PRODUCTS') c.innerHTML = renderProducts();
      else if (currentView === 'TRIPS') c.innerHTML = renderTrips();
      else if (currentView === 'CASH') c.innerHTML = renderCash();
      else if (currentView === 'PROFITS') c.innerHTML = renderProfits();
      else if (currentView === 'SETTINGS') c.innerHTML = renderSettings();
      if (currentView === 'TEAM') c.innerHTML = renderTeamView();
    }

    // 1. DASHBOARD
    function renderDashboard() {
      const s = appData.stats || {};
      const curr = appData.settings.currency || 'FCFA';
      const cash = appData.settings?.currentCash !== undefined ? appData.settings.currentCash : 81500;
      const pending = (appData.orders || []).filter(o => o.status !== 'LIVRE' && o.status !== 'ANNULE');
      const products = appData.products || [];

      return `
        <!-- Welcome Banner with carried-over cash of 81 500 F -->
        <div style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color:#fff; border-radius:12px; padding:1.75rem; margin-bottom:1.5rem; border-bottom:3px solid #c59b27;">
          <span style="background:rgba(197,155,39,0.2); border:1px solid #c59b27; padding:0.25rem 0.75rem; border-radius:9999px; font-size:0.75rem; font-weight:bold; text-transform:uppercase; color:#fef3c7;">
            ✨ Nouveau Départ - Octobre 2026
          </span>
          <h2 style="font-size:1.6rem; margin-top:0.5rem;">Bienvenue dans votre Espace de Gestion Maison Angy</h2>
          <p style="color:#94a3b8; font-size:0.9rem; margin-top:0.25rem;">
            Votre trésorerie réelle de <strong>${cash.toLocaleString('fr-FR')} ${curr}</strong> est conservée. Vos stocks et commandes sont prêts pour accueillir vos nouveaux arrivages d'octobre !
          </p>
          <div style="display:flex; gap:0.75rem; margin-top:1.25rem; flex-wrap:wrap;">
            <button class="btn-action-primary" onclick="openProductModal()">
              <span>+ Ajouter un Article d'Octobre</span>
            </button>
            <button class="btn-action-primary" style="background:#0f172a; border:1px solid #c59b27; color:#fef3c7;" onclick="openDeliveryPersonModal()">
              <span>+ Ajouter un Livreur</span>
            </button>
            <button class="btn-action-primary" style="background:#10b981; color:#fff;" onclick="openCashModal('DEPOT')">
              <span>+ Dépôt / Vente Caisse</span>
            </button>
          </div>
        </div>

        <!-- KPIs -->
        <div class="kpi-grid">
          <div class="kpi-card gold">
            <div class="kpi-icon gold">🪙</div>
            <div class="kpi-info">

                      </td>
                    </tr>
                  `;
                }).join('')}

            </table>
          </div>
        </div>
      `;
    }

    function calcMarginPreview() {
      const cost = parseFloat(document.getElementById('p_cost')?.value) || 0;
      const isPromo = document.getElementById('p_isPromo')?.checked;
      const sale = parseFloat(document.getElementById('p_sale')?.value) || 0;
      const promo = parseFloat(document.getElementById('p_promo')?.value) || 0;
      const activePrice = isPromo ? promo : sale;
      const margin = activePrice - cost;
      const pct = activePrice > 0 ? Math.round((margin / activePrice) * 100) : 0;
      const el = document.getElementById('marginValPreview');
      if (el) {
        el.textContent = '+' + margin.toLocaleString('fr-FR') + ' FCFA (' + pct + '% de marge)';
      }
    }

      if (st === 'EN_LIVRAISON') return '<span class="badge-status status-en-livraison">🟠 En livraison</span>';
      if (st === 'A_RECUPERER') return '<span class="badge-status status-a-recuperer">🔵 À récupérer</span>';
      if (st === 'EXPEDITION') return '<span class="badge-status status-expedition">🟣 Expédié</span>';
      if (st === 'LIVRE') return '<span class="badge-status status-livre">🟢 Livré</span>';
      return st;
    }

    function getDeliveryBadge(mode) {
      if (mode === 'LIVRAISON_DOMICILE') return '<span class="badge-status status-en-livraison">🛵 Domicile</span>';
      if (mode === 'RETRAIT_BOUTIQUE') return '<span class="badge-status status-a-recuperer">🏪 Boutique</span>';
      if (mode === 'EXPEDITION') return '<span class="badge-status status-expedition">📦 Gare</span>';
      return mode;
    }

    checkAuth();
  </script>
